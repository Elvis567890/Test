          #include "Scheduler.h"
          #include "SoundFontSynth.h"
          #include <algorithm>
          #include <climits>
          #include <cmath>

          Scheduler::Scheduler() {
              for (int i = 0; i < 16; ++i) {
                  userVolume[i] = 1.0f;
                  serverVolumeCur[i] = (i == 9 ? 0.9f : 0.8f);
                  serverVolumeTgt[i] = serverVolumeCur[i];
                  serverVolumeStep[i] = 0.0f;
                  fadeRemainingBeats[i] = 0.0f;
              }
              resetSnapshot();
              clearBarSlots();
              seedDefaultGroove();
          }

          void Scheduler::resetSnapshot() {
              InstrumentSnapshot empty{};
              instSnap[0] = empty;
              instSnap[1] = empty;
              instSnapIdx.store(0, std::memory_order_release);
          }

          void Scheduler::clearBarSlots() {
              for (auto& s : barSlots) { s.bar = -1; s.count = 0; }
              numPending = 0;
              lastGoodEventCount = 0;
              lastGoodBar = -1;
          }

          void Scheduler::seedDefaultGroove() {
              defaultGrooveCount = 0;
              auto push = [&](double beat, int ch, int note, float vel, double dur) {
                  if (defaultGrooveCount >= kMaxEventsPerBar) return;
                  defaultGroove[defaultGrooveCount++] = { beat, ch, note, vel, dur };
              };
              push(0.0, 9, 36, 0.9f, 0.1);
              push(2.0, 9, 36, 0.9f, 0.1);
              push(1.0, 9, 38, 0.8f, 0.1);
              push(3.0, 9, 38, 0.8f, 0.1);
              for (int i = 0; i < 8; ++i) push(i * 0.5, 9, 42, 0.4f, 0.05);
              for (int b = 0; b < 4; ++b) {
                  push((double)b, 2, 48, 0.5f, 0.9);
                  push((double)b, 2, 52, 0.5f, 0.9);
                  push((double)b, 2, 55, 0.5f, 0.9);
              }
              push(0.0, 1, 36, 0.7f, 0.4);
              push(2.0, 1, 36, 0.7f, 0.4);
              std::sort(defaultGroove, defaultGroove + defaultGrooveCount,
                  [](const ScheduledEvent& a, const ScheduledEvent& b) { return a.beat < b.beat; });
          }

          float Scheduler::humanizeVelocity(float baseVel) {
              float jitter = (((float)(rng() & 0xFFFFu) / 65535.0f) * 2.0f - 1.0f) * 0.06f;
              return juce::jlimit(0.05f, 1.0f, baseVel * (1.0f + jitter));
          }

          void Scheduler::triggerNoteOnClean(int ch, int midi, float vel, double offBeat, SoundFontSynth& synth) {
              for (int i = 0; i < numOffs; ) {
                  if (offs[i].ch == ch && offs[i].midi == midi) {
                      offs[i] = offs[--numOffs];
                  } else {
                      ++i;
                  }
              }
              synth.noteOff(ch, midi);
              synth.noteOn(ch, midi, vel);
              scheduleNoteOff(offBeat, ch, midi, synth);
          }

          void Scheduler::scheduleNoteOff(double offBeat, int ch, int midi, SoundFontSynth& synth) {
              if (numOffs >= kMaxOffs) {
                  synth.noteOff(offs[0].ch, offs[0].midi);
                  for (int i = 0; i < numOffs - 1; ++i) offs[i] = offs[i + 1];
                  --numOffs;
              }
              offs[numOffs++] = { offBeat, ch, midi };
          }

          void Scheduler::fireDueNoteOffs(double upToBeat, SoundFontSynth& synth) {
              for (int i = 0; i < numOffs; ) {
                  if (offs[i].beat <= upToBeat + 1e-9) {
                      synth.noteOff(offs[i].ch, offs[i].midi);
                      offs[i] = offs[--numOffs];
                  } else {
                      ++i;
                  }
              }
          }

          void Scheduler::start() {
              startRequested.store(true, std::memory_order_release);
          }

          void Scheduler::stop() {
              startRequested.store(false, std::memory_order_release);
              running.store(false, std::memory_order_release);
          }

          void Scheduler::applyStartRequestOnAudioThread(SoundFontSynth& synth) {
              synth.allNotesOff();
              beatPosition.store(0.0);
              currentBar.store(0);
              countInRemaining = beatsPerBar;
              countInBeatsElapsed = 0.0;
              lastCountInIdx = -1;
              numOffs = 0;
              eventCursor = 0;
              numActiveEvents = 0;
              planRingRead.store(planRingWrite.load(std::memory_order_acquire), std::memory_order_release);
              sliderFifo.reset();
              resetSnapshot();
              clearBarSlots();
              for (int i = 0; i < 16; ++i) {
                  userVolume[i] = 1.0f;
                  serverVolumeCur[i] = (i == 9 ? 0.9f : 0.8f);
                  serverVolumeTgt[i] = serverVolumeCur[i];
                  serverVolumeStep[i] = 0.0f;
                  fadeRemainingBeats[i] = 0.0f;
              }
              running.store(true, std::memory_order_release);
          }

          void Scheduler::queuePlan(const RawPlan& plan) {
              if (plan.bar < 0) return;
              int w = planRingWrite.load(std::memory_order_relaxed);
              int r = planRingRead.load(std::memory_order_acquire);
              if (w - r >= kPlanRingSize - 1) return;
              planRing[w % kPlanRingSize] = plan;
              planRingWrite.store(w + 1, std::memory_order_release);
          }

          void Scheduler::queueSliderChange(int ch, float v) {
              if (ch < 0 || ch >= 16) return;
              int s1, n1, s2, n2;
              sliderFifo.prepareToWrite(1, s1, n1, s2, n2);
              if (n1 > 0) { sliderMsgs[s1] = { ch, v }; sliderFifo.finishedWrite(1); }
              else if (n2 > 0) { sliderMsgs[s2] = { ch, v }; sliderFifo.finishedWrite(1); }
          }

          InstrumentSnapshot Scheduler::getInstrumentSnapshot() const {
              int idx = instSnapIdx.load(std::memory_order_acquire);
              return instSnap[idx];
          }

          void Scheduler::drainPlanRing() {
              int w = planRingWrite.load(std::memory_order_acquire);
              int r = planRingRead.load(std::memory_order_relaxed);
              int curBar = isCountingIn() ? -1 : currentBar.load(std::memory_order_acquire);
              while (r < w) {
                  const RawPlan& p = planRing[r % kPlanRingSize];
                  if (p.bar >= 0 && (isCountingIn() || p.bar > curBar) && numPending < kMaxBarSlots) {
                      int existing = -1;
                      for (int i = 0; i < numPending; ++i) {
                          if (pendingPlans[i].bar == p.bar) { existing = i; break; }
                      }
                      if (existing >= 0) pendingPlans[existing] = p;
                      else pendingPlans[numPending++] = p;
                  }
                  ++r;
              }
              planRingRead.store(r, std::memory_order_release);
          }

          void Scheduler::drainSliderFifo() {
              int ready = sliderFifo.getNumReady();
              if (ready <= 0) return;
              int s1, n1, s2, n2;
              sliderFifo.prepareToRead(ready, s1, n1, s2, n2);
              for (int i = 0; i < n1; ++i) {
                  const auto& m = sliderMsgs[s1 + i];
                  if (m.channel >= 0 && m.channel < 16) userVolume[m.channel] = m.value;
              }
              for (int i = 0; i < n2; ++i) {
                  const auto& m = sliderMsgs[s2 + i];
                  if (m.channel >= 0 && m.channel < 16) userVolume[m.channel] = m.value;
              }
              sliderFifo.finishedRead(n1 + n2);
          }

          void Scheduler::applyVolumeForChannel(int ch, SoundFontSynth& synth) {
              synth.setChannelVolume(ch, serverVolumeCur[ch] * userVolume[ch]);
          }

          void Scheduler::advanceFades(double beatsThisBlock) {
              for (int ch = 0; ch < 16; ++ch) {
                  if (fadeRemainingBeats[ch] > 0.0f) {
                      serverVolumeCur[ch] += serverVolumeStep[ch] * (float)beatsThisBlock;
                      fadeRemainingBeats[ch] -= (float)beatsThisBlock;
                      if (fadeRemainingBeats[ch] <= 0.0f) {
                          serverVolumeCur[ch] = serverVolumeTgt[ch];
                          fadeRemainingBeats[ch] = 0.0f;
                      }
                  }
              }
          }

          void Scheduler::applyPlanAtBar(const RawPlan& plan, SoundFontSynth& synth) {
              int slotIdx = -1, emptyIdx = -1;
              for (int i = 0; i < kMaxBarSlots; ++i) {
                  if (barSlots[i].bar == plan.bar) { slotIdx = i; break; }
                  if (barSlots[i].bar == -1 && emptyIdx < 0) emptyIdx = i;
              }
              if (slotIdx < 0) slotIdx = emptyIdx;
              if (slotIdx < 0) {
                  int lowest = INT_MAX;
                  for (int i = 0; i < kMaxBarSlots; ++i)
                      if (barSlots[i].bar < lowest) { lowest = barSlots[i].bar; slotIdx = i; }
              }
              barSlots[slotIdx].bar = plan.bar;
              barSlots[slotIdx].count = juce::jmin(plan.numEvents, kMaxEventsPerBar);
              for (int i = 0; i < barSlots[slotIdx].count; ++i)
                  barSlots[slotIdx].events[i] = plan.events[i];
              std::sort(barSlots[slotIdx].events, barSlots[slotIdx].events + barSlots[slotIdx].count,
                  [](const ScheduledEvent& a, const ScheduledEvent& b) { return a.beat < b.beat; });

              int next = 1 - instSnapIdx.load(std::memory_order_relaxed);
              instSnap[next] = instSnap[1 - next];
              for (int ch = 0; ch < 16; ++ch) {
                  const auto& m = plan.mixer[ch];
                  if (!m.present) continue;
                  if (m.preset >= 0) {
                      synth.setInstrument(ch, m.preset);
                      instSnap[next].ch[ch].preset = m.preset;
                      instSnap[next].ch[ch].present = true;
                  }
                  synth.setChannelPan(ch, m.pan);
                  float target = m.mute ? 0.0f : m.volume;
                  if (m.fade > 0.01f) {
                      serverVolumeTgt[ch] = target;
                      serverVolumeStep[ch] = (target - serverVolumeCur[ch]) / m.fade;
                      fadeRemainingBeats[ch] = m.fade;
                  } else {
                      serverVolumeCur[ch] = target;
                      serverVolumeTgt[ch] = target;
                      fadeRemainingBeats[ch] = 0.0f;
                      applyVolumeForChannel(ch, synth);
                  }
              }
              instSnapIdx.store(next, std::memory_order_release);
              if (followServerTempo.load(std::memory_order_acquire) && plan.tempo > 1.0) {
                  tempo.store(plan.tempo);
              }
          }

          void Scheduler::applyPendingPlansUpToBar(int bar, SoundFontSynth& synth) {
              for (int i = 0; i < numPending; ) {
                  if (pendingPlans[i].bar <= bar) {
                      RawPlan local = pendingPlans[i];
                      pendingPlans[i] = pendingPlans[--numPending];
                      applyPlanAtBar(local, synth);
                  } else {
                      ++i;
                  }
              }
          }

          void Scheduler::loadBarEventsFor(int bar, SoundFontSynth& synth) {
              applyPendingPlansUpToBar(bar, synth);
              int slotIdx = -1;
              for (int i = 0; i < kMaxBarSlots; ++i)
                  if (barSlots[i].bar == bar) { slotIdx = i; break; }
              if (slotIdx >= 0) {
                  numActiveEvents = barSlots[slotIdx].count;
                  for (int i = 0; i < numActiveEvents; ++i) activeEvents[i] = barSlots[slotIdx].events[i];
                  lastGoodEventCount = numActiveEvents;
                  for (int i = 0; i < numActiveEvents; ++i) lastGoodEvents[i] = activeEvents[i];
                  lastGoodBar = bar;
              } else if (lastGoodEventCount > 0) {
                  numActiveEvents = lastGoodEventCount;
                  for (int i = 0; i < numActiveEvents; ++i) activeEvents[i] = lastGoodEvents[i];
              } else {
                  numActiveEvents = defaultGrooveCount;
                  for (int i = 0; i < numActiveEvents; ++i) activeEvents[i] = defaultGroove[i];
              }
              eventCursor = 0;
          }

          void Scheduler::processBlock(int numSamples, SoundFontSynth& synth) {
              processBlockStereo(nullptr, nullptr, numSamples, synth);
          }

          void Scheduler::processBlockStereo(float* left, float* right, int numSamples, SoundFontSynth& synth) {
              if (startRequested.exchange(false, std::memory_order_acq_rel)) {
                  applyStartRequestOnAudioThread(synth);
              }

              if (!running.load(std::memory_order_acquire)) {
                  if (left) synth.renderSlice(left, right, 0, numSamples);
                  return;
              }
              drainPlanRing();
              drainSliderFifo();

              const double bpm = tempo.load();
              const double beatsPerSample = bpm / 60.0 / juce::jmax(1.0, sampleRate);
              const double samplesPerBeat = 1.0 / juce::jmax(1e-9, beatsPerSample);
              const double beatsThisBlock = beatsPerSample * numSamples;
              advanceFades(beatsThisBlock);
              for (int ch = 0; ch < 16; ++ch) applyVolumeForChannel(ch, synth);

              int cursorSample = 0;
              while (cursorSample < numSamples) {
                  const int remainingSamples = numSamples - cursorSample;

                  if (countInRemaining > 0.0) {
                      int nextClickBeatIdx = lastCountInIdx + 1;
                      if (nextClickBeatIdx < (int)beatsPerBar && countInBeatsElapsed >= (double)nextClickBeatIdx - 1e-9) {
                          lastCountInIdx = nextClickBeatIdx;
                          triggerNoteOnClean(9, kClickMidi, humanizeVelocity(0.95f),
                                             countInBeatsElapsed + 0.08, synth);
                      }
                      fireDueNoteOffs(countInBeatsElapsed, synth);

                      if (countInRemaining <= 1e-9) {
                          countInRemaining = 0.0;
                          beatPosition.store(0.0);
                          currentBar.store(0);
                          numOffs = 0;
                          loadBarEventsFor(0, synth);
                          continue;
                      }

                      double beatsUntilNextEvent = countInRemaining;
                      int upcomingClickIdx = lastCountInIdx + 1;
                      if (upcomingClickIdx < (int)beatsPerBar) {
                          double dClick = (double)upcomingClickIdx - countInBeatsElapsed;
                          if (dClick > 1e-9 && dClick < beatsUntilNextEvent)
                              beatsUntilNextEvent = dClick;
                      }
                      for (int i = 0; i < numOffs; ++i) {
                          double dOff = offs[i].beat - countInBeatsElapsed;
                          if (dOff > 1e-9 && dOff < beatsUntilNextEvent)
                              beatsUntilNextEvent = dOff;
                      }

                      int sliceLen = remainingSamples;
                      if (beatsUntilNextEvent < beatsThisBlock) {
                          sliceLen = juce::jlimit(1, remainingSamples, (int)std::floor(beatsUntilNextEvent * samplesPerBeat));
                          if (sliceLen <= 0) sliceLen = 1;
                      }
                      double sliceBeats = juce::jmin(countInRemaining, (double)sliceLen * beatsPerSample);

                      if (left) synth.renderSlice(left, right, cursorSample, sliceLen);
                      cursorSample += sliceLen;
                      countInRemaining = juce::jmax(0.0, countInRemaining - sliceBeats);
                      countInBeatsElapsed += sliceBeats;
                  } else {
                      double curBeat = beatPosition.load();
                      int curBarVal = currentBar.load();

                      int barAtCurBeat = (int)std::floor((curBeat + 1e-9) / beatsPerBar);
                      if (barAtCurBeat != curBarVal) {
                          currentBar.store(barAtCurBeat);
                          curBarVal = barAtCurBeat;
                          loadBarEventsFor(curBarVal, synth);
                      }

                      fireDueNoteOffs(curBeat, synth);

                      while (eventCursor < numActiveEvents) {
                          const auto& e = activeEvents[eventCursor];
                          double triggerBeat = (double)curBarVal * beatsPerBar + e.beat;
                          if (triggerBeat <= curBeat + 1e-9) {
                              triggerNoteOnClean(e.channel, e.midi, humanizeVelocity(e.velocity),
                                                 triggerBeat + juce::jmax(0.05, e.duration), synth);
                              ++eventCursor;
                          } else {
                              break;
                          }
                      }

                      double nextDueBeat = curBeat + (double)remainingSamples * beatsPerSample;
                      double nextBarBeat = (double)(curBarVal + 1) * beatsPerBar;
                      if (nextBarBeat > curBeat + 1e-9 && nextBarBeat < nextDueBeat) {
                          nextDueBeat = nextBarBeat;
                      }
                      if (eventCursor < numActiveEvents) {
                          double trigBeat = (double)curBarVal * beatsPerBar + activeEvents[eventCursor].beat;
                          if (trigBeat > curBeat + 1e-9 && trigBeat < nextDueBeat) {
                              nextDueBeat = trigBeat;
                          }
                      }
                      for (int i = 0; i < numOffs; ++i) {
                          if (offs[i].beat > curBeat + 1e-9 && offs[i].beat < nextDueBeat) {
                              nextDueBeat = offs[i].beat;
                          }
                      }

                      double deltaBeats = juce::jmax(0.0, nextDueBeat - curBeat);
                      int sliceLen = remainingSamples;
                      if (deltaBeats * samplesPerBeat < (double)remainingSamples) {
                          sliceLen = juce::jlimit(1, remainingSamples, (int)std::floor(deltaBeats * samplesPerBeat));
                      }
                      double actualDeltaBeats = (double)sliceLen * beatsPerSample;
                      double nextBeat = curBeat + actualDeltaBeats;

                      if (left) synth.renderSlice(left, right, cursorSample, sliceLen);
                      cursorSample += sliceLen;
                      beatPosition.store(nextBeat);
                  }
              }
          }
