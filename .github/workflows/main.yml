          cat > Source/TempoEstimator.cpp << 'EOF'
          #include "TempoEstimator.h"
          #include <JuceHeader.h>
          #include <algorithm>
          #include <cstddef>

          void TempoEstimator::reset() {
              iois.fill(0.0);
              count = 0;
              idx = 0;
              lastOnset = -1.0;
          }

          void TempoEstimator::addOnset(double t) {
              if (lastOnset > 0) {
                  double ioi = t - lastOnset;
                  if (ioi > 0.1 && ioi < 2.0) {
                      iois[(size_t)idx] = ioi; idx = (idx + 1) % kMax;
                      if (count < kMax) ++count;
                  }
              }
              lastOnset = t;
          }
          TempoEstimator::Result TempoEstimator::estimate() const {
              if (count < 3) return {120.0, 0.0f};
              std::array<double, kMax> s = iois;
              std::sort(s.begin(), s.begin() + count);
              double median = s[(size_t)(count / 2)];
              double q1 = s[(size_t)(count / 4)];
              double q3 = s[(size_t)((3 * count) / 4)];
              double iqr = q3 - q1;
              double bpm = 60.0 / median;
              if (bpm < 40.0 || bpm > 240.0) return {120.0, 0.0f};
              float conf = (float)juce::jlimit(0.0, 1.0, 1.0 - iqr / juce::jmax(0.02, median));
              return { bpm, conf };
          }
