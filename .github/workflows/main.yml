            "Nylon Guitar","Steel Guitar","Jazz Guitar","Clean Guitar","Muted Guitar","Overdrive Guitar","Distortion Guitar","Guitar Harmonics",
            "Acoustic Bass","Finger Bass","Pick Bass","Fretless Bass","Slap Bass 1","Slap Bass 2","Synth Bass 1","Synth Bass 2",
            "Violin","Viola","Cello","Contrabass","Tremolo Strings","Pizzicato Strings","Orchestral Harp","Timpani",
            "String Ensemble 1","String Ensemble 2","Syn Strings 1","Syn Strings 2","Choir Aahs","Voice Oohs","Syn Voice","Orch Hit",
            "Trumpet","Trombone","Tuba","Muted Trumpet","French Horn","Brass Section","Syn Brass 1","Syn Brass 2",
            "Soprano Sax","Alto Sax","Tenor Sax","Baritone Sax","Oboe","English Horn","Bassoon","Clarinet",
            "Piccolo","Flute","Recorder","Pan Flute","Blown Bottle","Shakuhachi","Whistle","Ocarina",
            "Square Lead","Saw Lead","Calliope Lead","Chiff Lead","Charang","Voice Lead","Fifths","Bass+Lead",
            "New Age Pad","Warm Pad","Polysynth Pad","Choir Pad","Bowed Pad","Metallic Pad","Halo Pad","Sweep Pad",
            "Rain","Soundtrack","Crystal","Atmosphere","Brightness","Goblins","Echoes","Sci-Fi",
            "Sitar","Banjo","Shamisen","Koto","Kalimba","Bagpipe","Fiddle","Shanai",
            "Tinkle Bell","Agogo","Steel Drums","Woodblock","Taiko Drum","Melodic Tom","Syn Drum","Reverse Cymbal",
            "Guitar Fret","Breath","Seashore","Bird Tweet","Telephone","Helicopter","Applause","Gunshot"
          };
          static const char* const GM_KEYS[12] = {"C","C#","D","D#","E","F","F#","G","G#","A","A#","B"};
          EOF

          cat > Source/PitchDetector.h << 'EOF'
          #pragma once
          #include <JuceHeader.h>
          #include <array>
          #include <atomic>
          #include <cstdint>

          class PitchDetector : private juce::Thread {
          public:
              struct Frame {
                  float frequency = 0.0f, confidence = 0.0f, rms = 0.0f;
                  int   midi = -1;
                  bool  voiced = false;
              };
              PitchDetector();
              ~PitchDetector() override;
              void prepare(double sampleRate);
              double getInputSampleRate() const { return inputSr; }
              double getAnalysisSampleRate() const { return analysisSr; }
              void feed(const float* samples, int numSamples);
              void setVoicedThreshold(float rmsThreshold);
              float getVoicedThreshold() const;
              Frame latestFrame() const;
              static juce::String freqToNote(float freq);
              static int   freqToMidi(float freq);
              static float midiToFreq(int midi);
          private:
              void run() override;
              static constexpr int64_t kRingSize = 16384;
              static constexpr int64_t kWindow   = 1024;
              static constexpr int64_t kHop      = 256;

              std::array<float, (size_t)kRingSize> ring{};
              std::atomic<int64_t> writePos { 0 };
              std::atomic<int64_t> lastAnalyzed { 0 };
              std::atomic<float>   voicedThreshold { 0.015f };

              double inputSr = 44100.0;
              int    decimFactor = 3;
              double analysisSr = 14700.0;

              std::atomic<float> outFreq { 0.0f };
              std::atomic<float> outConf { 0.0f };
              std::atomic<float> outRms  { 0.0f };
              std::atomic<int>   outMidi { -1 };
              std::atomic<bool>  outVoiced { false };

              std::array<float, (size_t)kWindow> buf{};
              std::array<float, (size_t)(kWindow / 2)> yin{};
              std::array<float, (size_t)(kWindow / 2)> cmnd{};
              std::array<float, 8> pitchHist{};
              int  pitchHistCount = 0;
              std::array<int, 8> midiHist{};
              int  midiHistCount = 0;
              int  lastMidiLocal = -1;
          };
          EOF

          cat > Source/PitchDetector.cpp << 'EOF'
          #include "PitchDetector.h"
          #include <algorithm>
          #include <cmath>

          PitchDetector::PitchDetector() : juce::Thread("PitchWorker") {}
          PitchDetector::~PitchDetector() { signalThreadShouldExit(); notify(); stopThread(2000); }

          void PitchDetector::setVoicedThreshold(float rmsThreshold) {
              voicedThreshold.store(juce::jlimit(0.0005f, 0.5f, rmsThreshold), std::memory_order_release);
          }

          float PitchDetector::getVoicedThreshold() const {
              return voicedThreshold.load(std::memory_order_acquire);
          }

          void PitchDetector::prepare(double sampleRate) {
              inputSr = juce::jmax(8000.0, sampleRate);
              int factor = (int)std::llround(inputSr / 14500.0);
              decimFactor = juce::jlimit(1, 8, factor);
              analysisSr = inputSr / (double)decimFactor;

              writePos.store(0, std::memory_order_release);
              lastAnalyzed.store(0, std::memory_order_release);
              pitchHistCount = 0; midiHistCount = 0; lastMidiLocal = -1;
              outFreq.store(0.0f, std::memory_order_release);
              outConf.store(0.0f, std::memory_order_release);
              outRms.store(0.0f, std::memory_order_release);
              outMidi.store(-1, std::memory_order_release);
              outVoiced.store(false, std::memory_order_release);
              if (!isThreadRunning()) startThread(juce::Thread::Priority::low);
          }

          void PitchDetector::feed(const float* s, int n) {
              if (!s || n <= 0) return;
              const int df = juce::jmax(1, decimFactor);
              const int64_t wp = writePos.load(std::memory_order_relaxed);
              int64_t outIdx = wp;
              const float invDf = 1.0f / (float)df;
              for (int i = 0; i + df <= n; i += df) {
                  float acc = 0.0f;
                  for (int k = 0; k < df; ++k) acc += s[i + k];
                  ring[(size_t)(outIdx % kRingSize)] = acc * invDf;
                  ++outIdx;
              }
              if (outIdx != wp) {
                  writePos.store(outIdx, std::memory_order_release);
              }
          }

          PitchDetector::Frame PitchDetector::latestFrame() const {
              Frame f;
              f.frequency  = outFreq.load(std::memory_order_acquire);
              f.confidence = outConf.load(std::memory_order_acquire);
              f.rms        = outRms.load(std::memory_order_acquire);
              f.midi       = outMidi.load(std::memory_order_acquire);
              f.voiced     = outVoiced.load(std::memory_order_acquire);
              return f;
          }

          void PitchDetector::run() {
              while (!threadShouldExit()) {
                  wait(5);
                  const int64_t wp = writePos.load(std::memory_order_acquire);
                  const int64_t prevAnalyzed = lastAnalyzed.load(std::memory_order_relaxed);
                  if (wp - prevAnalyzed < kHop) continue;
                  if (wp < kWindow) {
                      lastAnalyzed.store(wp, std::memory_order_release);
                      continue;
                  }
                  lastAnalyzed.store(wp, std::memory_order_release);

                  const int64_t start = wp - kWindow;
                  for (int64_t i = 0; i < kWindow; ++i) {
                      const int64_t idx = (start + i) % kRingSize;
                      buf[(size_t)i] = ring[(size_t)idx];
                  }

                  double sqSum = 0.0;
                  for (int64_t i = 0; i < kWindow; ++i) {
                      const double sample = (double)buf[(size_t)i];
                      sqSum += sample * sample;
                  }
                  const float rms = (float)std::sqrt(sqSum / (double)kWindow);
                  outRms.store(rms, std::memory_order_release);
                  const float threshold = voicedThreshold.load(std::memory_order_acquire);

                  const int half = (int)(kWindow / 2);
                  const int maxTau = juce::jmin(half - 1, (int)(analysisSr / 65.0));
                  const int minTau = juce::jmax(2, (int)(analysisSr / 1400.0));
                  if (maxTau <= minTau + 2) {
                      outVoiced.store(false, std::memory_order_release);
                      continue;
                  }

                  for (int tau = 1; tau <= maxTau; ++tau) {
                      double s = 0.0;
                      for (int j = 0; j < half; ++j) {
                          double d = (double)buf[(size_t)j] - (double)buf[(size_t)(j + tau)];
                          s += d * d;
                      }
                      yin[(size_t)tau] = (float)s;
                  }
                  yin[0] = 0.0f; cmnd[0] = 1.0f;
                  double running = 0.0;
                  for (int tau = 1; tau <= maxTau; ++tau) {
                      running += (double)yin[(size_t)tau];
                      cmnd[(size_t)tau] = running > 1e-9 ? (float)((double)yin[(size_t)tau] * (double)tau / running) : 1.0f;
                  }
                  int tauEst = -1;
                  for (int tau = minTau; tau < maxTau; ++tau) {
                      if (cmnd[(size_t)tau] < 0.15f) {
                          while (tau + 1 < maxTau && cmnd[(size_t)(tau + 1)] < cmnd[(size_t)tau]) ++tau;
                          tauEst = tau; break;
                      }
                  }
                  if (tauEst < 0 || rms <= threshold) {
                      outVoiced.store(false, std::memory_order_release);
                      continue;
                  }
                  float betterTau = (float)tauEst;
                  if (tauEst > 0 && tauEst < maxTau) {
                      float s0 = cmnd[(size_t)(tauEst - 1)], s1 = cmnd[(size_t)tauEst], s2 = cmnd[(size_t)(tauEst + 1)];
                      float denom = 2.0f * (2.0f * s1 - s2 - s0);
                      if (std::abs(denom) > 1e-6f) betterTau = (float)tauEst + (s2 - s0) / denom;
                  }
                  float freq = (float)(analysisSr / (double)betterTau);
                  float conf = juce::jlimit(0.0f, 1.0f, 1.0f - cmnd[(size_t)tauEst]);
                  int midi = (int)std::round(69.0 + 12.0 * std::log2((double)freq / 440.0));
                  if (midi < 21 || midi > 108) {
                      outVoiced.store(false, std::memory_order_release);
                      continue;
                  }
                  if (lastMidiLocal > 0 && std::abs(midi - lastMidiLocal) == 12) {
                      int stable = 0;
                      for (int k = 0; k < midiHistCount; ++k) if (midiHist[(size_t)k] == midi) ++stable;
                      if (stable < 2) { midi = lastMidiLocal; freq = midiToFreq(midi); }
                  }
                  if (pitchHistCount < 8) pitchHist[(size_t)(pitchHistCount++)] = freq;
                  else { std::rotate(pitchHist.begin(), pitchHist.begin()+1, pitchHist.end()); pitchHist[7] = freq; }
                  if (midiHistCount < 8) midiHist[(size_t)(midiHistCount++)] = midi;
                  else { std::rotate(midiHist.begin(), midiHist.begin()+1, midiHist.end()); midiHist[7] = midi; }
                  if (pitchHistCount >= 3) {
                      std::array<float, 8> s = pitchHist;
                      std::sort(s.begin(), s.begin() + pitchHistCount);
                      float med = s[(size_t)(pitchHistCount / 2)];
                      if (std::abs(std::log2((double)(med / freq))) > 0.4) {
                          freq = med;
                          midi = (int)std::round(69.0 + 12.0 * std::log2((double)freq / 440.0));
                      }
                  }
                  const bool voiced = conf > 0.5f && freq > 60.0f && freq < 2000.0f && rms > threshold;
                  if (voiced) lastMidiLocal = midi;
                  outFreq.store(freq, std::memory_order_release);
                  outConf.store(conf, std::memory_order_release);
                  outMidi.store(midi, std::memory_order_release);
                  outVoiced.store(voiced, std::memory_order_release);
              }
          }

          juce::String PitchDetector::freqToNote(float freq) {
              if (freq <= 0.0f) return "-";
              static const char* N[] = {"C","C#","D","D#","E","F","F#","G","G#","A","A#","B"};
              int m = freqToMidi(freq);
              return juce::String(N[((m % 12) + 12) % 12]) + juce::String(m / 12 - 1);
          }
          int PitchDetector::freqToMidi(float freq) {
              if (freq <= 0.0f) return 0;
              return (int)std::round(69.0 + 12.0 * std::log2((double)freq / 440.0));
          }
          float PitchDetector::midiToFreq(int midi) { return 440.0f * std::pow(2.0f, (float)(midi - 69) / 12.0f); }
