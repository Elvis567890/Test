            <MAINGROUP id="m" name="AI Live Band">
              <GROUP id="g" name="Source">
                <FILE id="f1"  name="Main.cpp" compile="1" resource="0" file="Source/Main.cpp"/>
                <FILE id="f2"  name="MainComponent.cpp" compile="1" resource="0" file="Source/MainComponent.cpp"/>
                <FILE id="f3"  name="MainComponent.h" compile="0" resource="0" file="Source/MainComponent.h"/>
                <FILE id="f4"  name="PitchDetector.cpp" compile="1" resource="0" file="Source/PitchDetector.cpp"/>
                <FILE id="f5"  name="PitchDetector.h" compile="0" resource="0" file="Source/PitchDetector.h"/>
                <FILE id="f15" name="NoteTracker.cpp" compile="1" resource="0" file="Source/NoteTracker.cpp"/>
                <FILE id="f16" name="NoteTracker.h" compile="0" resource="0" file="Source/NoteTracker.h"/>
                <FILE id="f17" name="Scheduler.cpp" compile="1" resource="0" file="Source/Scheduler.cpp"/>
                <FILE id="f18" name="Scheduler.h" compile="0" resource="0" file="Source/Scheduler.h"/>
                <FILE id="f6"  name="ChordInference.cpp" compile="1" resource="0" file="Source/ChordInference.cpp"/>
                <FILE id="f7"  name="ChordInference.h" compile="0" resource="0" file="Source/ChordInference.h"/>
                <FILE id="f19" name="KeyEstimator.cpp" compile="1" resource="0" file="Source/KeyEstimator.cpp"/>
                <FILE id="f20" name="KeyEstimator.h" compile="0" resource="0" file="Source/KeyEstimator.h"/>
                <FILE id="f21" name="TempoEstimator.cpp" compile="1" resource="0" file="Source/TempoEstimator.cpp"/>
                <FILE id="f22" name="TempoEstimator.h" compile="0" resource="0" file="Source/TempoEstimator.h"/>
                <FILE id="f8"  name="Arranger.cpp" compile="1" resource="0" file="Source/Arranger.cpp"/>
                <FILE id="f9"  name="Arranger.h" compile="0" resource="0" file="Source/Arranger.h"/>
                <FILE id="f10" name="SoundFontSynth.cpp" compile="1" resource="0" file="Source/SoundFontSynth.cpp"/>
                <FILE id="f11" name="SoundFontSynth.h" compile="0" resource="0" file="Source/SoundFontSynth.h"/>
                <FILE id="f12" name="tsf.h" compile="0" resource="0" file="Source/tsf.h"/>
                <FILE id="f14" name="GMNames.h" compile="0" resource="0" file="Source/GMNames.h"/>
                <FILE id="f23" name="Config.h" compile="0" resource="0" file="Source/Config.h"/>
              </GROUP>
              <GROUP id="g2" name="BinaryData">
                <FILE id="f13" name="SoundFont.sf2" compile="0" resource="1" file="Source/SoundFont.sf2"/>
              </GROUP>
            </MAINGROUP>
            <MODULES>
              <MODULE id="juce_core" showAllCode="1" useGlobalPath="1"/>
