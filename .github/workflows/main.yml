          class NoteTracker {
          public:
              void setBeatsPerBar(int b) { beatsPerBar = b; }
              void resetAudioClock() { audioTimeSec = 0.0; }
              void processBlockFrames(const PitchDetector::Frame& f, double beat, int bar,
                                      int numSamples, double sampleRate);
              std::vector<NoteEventRecord> drainEvents();
              bool drainPhraseEnd();
              bool  isSinging()  const { return singing.load(std::memory_order_relaxed); }
