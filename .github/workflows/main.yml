                <FILE id="f6" name="ChordInference.cpp" compile="1" resource="0" file="Source/ChordInference.cpp"/>
                <FILE id="f7" name="ChordInference.h" compile="0" resource="0" file="Source/ChordInference.h"/>
                <FILE id="f8" name="Arranger.cpp" compile="1" resource="0" file="Source/Arranger.cpp"/>
