          cat > Source/NoteTracker.cpp << 'EOF'
          #include "NoteTracker.h"
          #include <cmath>

          void NoteTracker::pushEvent(const NoteEventRecord& e) {
              int s1, n1, s2, n2;
              fifo.prepareToWrite(1, s1, n1, s2, n2);
              if (n1 > 0) { queue[s1] = e; fifo.finishedWrite(1); }
              else if (n2 > 0) { queue[s2] = e; fifo.finishedWrite(1); }
          }

          void NoteTracker::finishCurrentNote(double beat) {
              if (!inNote) return;
              double dur = beat - noteStartBeat;
              if (dur >= kMinNoteBeats) {
                  NoteEventRecord e;
                  e.bar = noteStartBar;
                  e.beat = std::fmod(noteStartBeat, (double)beatsPerBar);
                  e.midi = currentMidi;
                  e.velocity = currentVelocity;
                  e.durationBeats = dur;
                  e.confidence = currentConfidence;
                  e.onsetTimeSec = noteStartAudioTimeSec;
                  pushEvent(e);
              }
              inNote = false;
              currentMidi = -1;
              pendingMidi = -1;
          }

          void NoteTracker::processBlockFrames(const PitchDetector::Frame& f, double beat, int bar,
                                               int numSamples, double sampleRate) {
              loudness.store(f.rms, std::memory_order_relaxed);
              loudnessTrend.store(f.rms - lastLoudness, std::memory_order_relaxed);
              lastLoudness = f.rms;
              const bool voiced = f.voiced && f.midi >= 21 && f.midi <= 108;
              singing.store(voiced, std::memory_order_relaxed);
              if (voiced) everSang = true;

              if (voiced) {
                  phraseEndFired = false;
                  if (!inNote) {
                      if (pendingMidi != f.midi) {
                          pendingMidi = f.midi;
                          pendingMidiStartTimeSec = audioTimeSec;
                      }
                      if ((audioTimeSec - pendingMidiStartTimeSec) >= kNoteHoldSeconds) {
                          inNote = true;
                          currentMidi = f.midi;
                          noteStartBeat = beat;
                          noteStartBar = bar;
                          noteStartAudioTimeSec = audioTimeSec;
                          currentVelocity = juce::jlimit(0.1f, 1.0f, f.rms * 3.0f);
                          currentConfidence = f.confidence;
                          pendingMidi = -1;
                      }
                  } else {
                      int diff = std::abs(f.midi - currentMidi);
                      if (diff <= kMaxFlickerSemitones) {
                          pendingMidi = -1;
                      } else {
                          if (pendingMidi != f.midi) {
                              pendingMidi = f.midi;
                              pendingMidiStartTimeSec = audioTimeSec;
                          }
                          if ((audioTimeSec - pendingMidiStartTimeSec) >= kNoteHoldSeconds) {
                              finishCurrentNote(beat);
                              inNote = true;
                              currentMidi = f.midi;
                              noteStartBeat = beat;
                              noteStartBar = bar;
                              noteStartAudioTimeSec = audioTimeSec;
                              currentVelocity = juce::jlimit(0.1f, 1.0f, f.rms * 3.0f);
                              currentConfidence = f.confidence;
                              pendingMidi = -1;
                          }
                      }
                  }
                  inSilence = false;
              } else {
                  finishCurrentNote(beat);
                  if (!inSilence) { inSilence = true; silenceStartBeat = beat; }
                  else if (everSang && !phraseEndFired && (beat - silenceStartBeat) >= kPhraseGapBeats) {
                      phraseEndPending.store(true, std::memory_order_relaxed);
                      phraseEndFired = true;
                  }
              }
              audioTimeSec += (double)numSamples / juce::jmax(1.0, sampleRate);
          }

          std::vector<NoteEventRecord> NoteTracker::drainEvents() {
              std::vector<NoteEventRecord> out;
              int ready = fifo.getNumReady();
              if (ready <= 0) return out;
              out.reserve(ready);
              int s1, n1, s2, n2;
              fifo.prepareToRead(ready, s1, n1, s2, n2);
              for (int i = 0; i < n1; ++i) out.push_back(queue[s1 + i]);
              for (int i = 0; i < n2; ++i) out.push_back(queue[s2 + i]);
              fifo.finishedRead(n1 + n2);
              return out;
          }
          bool NoteTracker::drainPhraseEnd() {
              return phraseEndPending.exchange(false, std::memory_order_relaxed);
          }
