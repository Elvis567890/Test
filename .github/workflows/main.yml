          cat > Source/KeyEstimator.cpp << 'EOF'
          #include "KeyEstimator.h"
          #include <JuceHeader.h>
          #include <algorithm>
          #include <cmath>
          #include <cstddef>

          void KeyEstimator::reset() {
              for (auto& w : weights) w = 0.0f;
              total = 0.0f;
          }

          void KeyEstimator::addNoteDuration(int midi, double durationBeats) {
              for (auto& w : weights) w *= 0.995f;
              float d = (float)juce::jlimit(0.05, 4.0, durationBeats);
              size_t pc = (size_t)(((midi % 12) + 12) % 12);
              weights[pc] += d;
              total = 0.0f;
              for (auto w : weights) total += w;
              if (total > 200.0f) {
                  float k = 200.0f / total;
                  for (auto& w : weights) w *= k;
                  total = 200.0f;
              }
          }

          KeyEstimator::Result KeyEstimator::estimate() const {
              static const float MAJ[12] = {6.35f,2.23f,3.48f,2.33f,4.38f,4.09f,2.52f,5.19f,2.39f,3.66f,2.29f,2.88f};
              static const float MIN[12] = {6.33f,2.68f,3.52f,5.38f,2.60f,3.53f,2.54f,4.75f,3.98f,2.69f,3.34f,3.17f};
              auto corr = [&](const float* profile, size_t tonic) {
                  float mP = 0.0f; for (size_t i = 0; i < 12; ++i) mP += profile[i]; mP /= 12.0f;
                  float mW = total / 12.0f;
                  float num = 0, dw2 = 0, dp2 = 0;
                  for (size_t i = 0; i < 12; ++i) {
                      float dw = weights[(tonic + i) % 12] - mW;
                      float dp = profile[i] - mP;
                      num += dw * dp; dw2 += dw * dw; dp2 += dp * dp;
                  }
                  float den = std::sqrt(dw2 * dp2);
                  return den > 1e-6f ? num / den : 0.0f;
              };
              float best = -2.0f;
              int bestTonic = 0; bool bestMinor = false;
              for (size_t T = 0; T < 12; ++T) {
                  float cM = corr(MAJ, T);
                  if (cM > best) { best = cM; bestTonic = (int)T; bestMinor = false; }
                  float cm = corr(MIN, T);
                  if (cm > best) { best = cm; bestTonic = (int)T; bestMinor = true; }
              }
              return { bestTonic, bestMinor, juce::jlimit(0.0f, 1.0f, best) };
          }
