
name: AFRINODE AI LIVE BAND - Generate Server Files

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-afrinode-live-band.yml"

permissions:
  contents: write

concurrency:
  group: afrinode-live-band-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create server files
        shell: bash
        run: |
          mkdir -p server tests docs

          cat > server/requirements.txt <<'EOF'
          websockets>=13,<16
          EOF

          cat > server/app.py <<'PY'
          import asyncio
          import json
          import math
          import os
          import time
          import uuid
          from websockets.asyncio.server import serve

          HOST = "0.0.0.0"
          PORT = int(os.getenv("PORT", "8765"))
          UPDATE_INTERVAL = 1.5

          SCALES = {
              "C": [60, 62, 64, 65, 67, 69, 71],
              "D": [62, 64, 66, 67, 69, 71, 73],
              "E": [64, 66, 68, 69, 71, 73, 75],
              "F": [65, 67, 69, 70, 72, 74, 76],
              "G": [67, 69, 71, 72, 74, 76, 78],
              "A": [69, 71, 73, 74, 76, 78, 80],
          }

          CHORDS = {
              "C": [0, 2, 4],
              "Dm": [1, 3, 5],
              "Em": [2, 4, 6],
              "F": [3, 5, 0],
              "G": [4, 6, 1],
              "Am": [5, 0, 2],
          }

          SESSIONS = {}

          def clamp(value, low, high):
              return max(low, min(high, value))

          def safe_number(value, default, low, high):
              try:
                  return clamp(float(value), low, high)
              except (TypeError, ValueError):
                  return default

          def infer_style(message):
              style = str(message.get("style", "Gospel")).strip()
              allowed = {
                  "Gospel", "Worship", "Afrobeat",
                  "Jazz", "Pop", "Reggae", "Soul"
              }
              return style if style in allowed else "Gospel"

          def infer_key(message):
              key = str(message.get("key", "C")).strip()
              return key if key in SCALES else "C"

          def infer_chord(message):
              chord = str(message.get("chord", "C")).strip()
              return chord if chord in CHORDS else "C"

          def make_events(key, chord, style, bpm):
              scale = SCALES[key]
              chord_degrees = CHORDS[chord]
              beat_ms = 60000.0 / bpm

              # Each event is a MIDI note instruction.
              # The Android app must schedule these locally.
              events = []

              # Bass: root note on each beat.
              root = scale[chord_degrees[0]] - 24
              for beat in range(4):
                  events.append({
                      "time_ms": round(beat * beat_ms),
                      "duration_ms": round(beat_ms * 0.75),
                      "note": root,
                      "velocity": 92,
                      "instrument": "bass"
                  })

              # Chord accompaniment.
              chord_notes = [
                  scale[degree] + 12 for degree in chord_degrees
              ]

              for beat in range(4):
                  if style in ("Worship", "Jazz", "Soul"):
                      beat_position = beat * beat_ms
                  elif style == "Reggae":
                      beat_position = (beat + 0.5) * beat_ms
                  else:
                      beat_position = beat * beat_ms

                  for note in chord_notes:
                      events.append({
                          "time_ms": round(beat_position),
                          "duration_ms": round(beat_ms * 0.8),
                          "note": note,
                          "velocity": 65,
                          "instrument": "keys"
                      })

              # Simple melodic response.
              melody_degrees = chord_degrees + [chord_degrees[1]]
              for index, degree in enumerate(melody_degrees):
                  events.append({
                      "time_ms": round(index * beat_ms),
                      "duration_ms": round(beat_ms * 0.45),
                      "note": scale[degree] + 24,
                      "velocity": 72,
                      "instrument": "lead"
                  })

              events.sort(key=lambda item: item["time_ms"])
              return events

          def make_arrangement(message):
              key = infer_key(message)
              chord = infer_chord(message)
              style = infer_style(message)
              bpm = safe_number(message.get("bpm"), 90, 50, 180)

              return {
                  "type": "arrangement",
                  "protocol": "afrinode-live-band-v1",
                  "session_id": message.get("session_id"),
                  "timestamp_ms": int(time.time() * 1000),
                  "key": key,
                  "chord": chord,
                  "style": style,
                  "bpm": round(bpm, 1),
                  "beats_per_bar": 4,
                  "bar_duration_ms": round(240000 / bpm),
                  "events": make_events(key, chord, style, bpm)
              }

          async def send_json(websocket, payload):
              await websocket.send(json.dumps(payload))

          async def handle_client(websocket):
              session_id = str(uuid.uuid4())
              SESSIONS[session_id] = {
                  "last_sent": 0.0,
                  "active": False
              }

              print("Connected:", session_id)

              try:
                  await send_json(websocket, {
                      "type": "connected",
                      "protocol": "afrinode-live-band-v1",
                      "session_id": session_id
                  })

                  async for raw_message in websocket:
                      try:
                          message = json.loads(raw_message)
                      except json.JSONDecodeError:
                          await send_json(websocket, {
                              "type": "error",
                              "message": "Message must be valid JSON"
                          })
                          continue

                      if not isinstance(message, dict):
                          await send_json(websocket, {
                              "type": "error",
                              "message": "Expected a JSON object"
                          })
                          continue

                      message_type = message.get("type")

                      if message_type == "ping":
                          await send_json(websocket, {
                              "type": "pong",
                              "timestamp_ms": int(time.time() * 1000)
                          })
                          continue

                      if message_type == "stop":
                          SESSIONS[session_id]["active"] = False
                          await send_json(websocket, {
                              "type": "stopped",
                              "session_id": session_id
                          })
                          continue

                      if message_type == "start":
                          SESSIONS[session_id]["active"] = True
                          message["session_id"] = session_id
                          await send_json(websocket, {
                              "type": "started",
                              "session_id": session_id
                          })
                          arrangement = make_arrangement(message)
                          await send_json(websocket, arrangement)
                          SESSIONS[session_id]["last_sent"] = time.monotonic()
                          continue

                      if message_type in ("vocal_features", "update"):
                          if not SESSIONS[session_id]["active"]:
                              continue

                          now = time.monotonic()
                          last_sent = SESSIONS[session_id]["last_sent"]

                          # Limit arrangement updates to avoid flooding
                          # the Android app with repeated instructions.
                          if now - last_sent < UPDATE_INTERVAL:
                              continue

                          message["session_id"] = session_id
                          arrangement = make_arrangement(message)
                          await send_json(websocket, arrangement)
                          SESSIONS[session_id]["last_sent"] = now
                          continue

                      await send_json(websocket, {
                          "type": "error",
                          "message": "Unknown message type"
                      })

              except Exception as exc:
                  print("Client error:", repr(exc))
              finally:
                  SESSIONS.pop(session_id, None)
                  print("Disconnected:", session_id)

          async def main():
              print(f"AfriNode Live Band server listening on {HOST}:{PORT}")
              async with serve(
                  handle_client,
                  HOST,
                  PORT,
                  ping_interval=20,
                  ping_timeout=20,
                  max_size=1024 * 1024
              ):
                  await asyncio.Future()

          if __name__ == "__main__":
              asyncio.run(main())
          PY

          cat > server/Dockerfile <<'EOF'
          FROM python:3.11-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY app.py .
          ENV PORT=8765
          EXPOSE 8765
          CMD ["python", "app.py"]
          EOF

          cat > server/README.md <<'EOF'
          # AfriNode Live Band Server

          WebSocket arrangement server for the AfriNode AI Live Band project.

          ## Start

          ```bash
          pip install -r requirements.txt
          python app.py
          ```

          Default port: 8765

          WebSocket address:

          `ws://YOUR_SERVER_IP:8765`

          ## Start a performance

          Send:

          ```json
          {
            "type": "start",
            "style": "Gospel",
            "key": "C",
            "chord": "C",
            "bpm": 90
          }
          ```

          ## Send updated vocal features

          ```json
          {
            "type": "vocal_features",
            "style": "Worship",
            "key": "C",
            "chord": "Am",
            "bpm": 82,
            "pitch_hz": 220,
            "confidence": 0.9
          }
          ```

          Updates are rate-limited to one arrangement every 1.5 seconds.

          ## Stop

          ```json
          {"type": "stop"}
          ```

          ## Important

          This server sends musical arrangement instructions as JSON.
          It does not stream audio. The Android app must parse each
          arrangement's `events` array and schedule MIDI notes through
          its local SoundFont synthesizer.

          Each event contains:
          - `time_ms`: time relative to the beginning of the bar
          - `duration_ms`: note duration
          - `note`: MIDI note number
          - `velocity`: MIDI velocity
          - `instrument`: bass, keys, or lead
          EOF

          cat > tests/test_server.py <<'PY'
          import os
          import sys
          import unittest

          sys.path.insert(
              0,
              os.path.abspath(os.path.join(os.path.dirname(__file__), "..", "server"))
          )

          from app import make_arrangement

          class ArrangementTests(unittest.TestCase):
              def test_arrangement_has_events(self):
                  result = make_arrangement({
                      "style": "Gospel",
                      "key": "C",
                      "chord": "C",
                      "bpm": 90
                  })
                  self.assertEqual(result["type"], "arrangement")
                  self.assertGreater(len(result["events"]), 0)

              def test_bpm_is_limited(self):
                  result = make_arrangement({"bpm": 500})
                  self.assertEqual(result["bpm"], 180)

              def test_unknown_key_uses_c(self):
                  result = make_arrangement({"key": "UNKNOWN"})
                  self.assertEqual(result["key"], "C")

          if __name__ == "__main__":
              unittest.main()
          PY

          cat > docs/SERVER_PROTOCOL.md <<'EOF'
          # AfriNode Live Band - Server Protocol

          Transport: WebSocket
          Protocol: afrinode-live-band-v1

          Android sends JSON messages:
          - `start`
          - `vocal_features`
          - `stop`
          - `ping`

          Server returns JSON messages:
          - `connected`
          - `started`
          - `arrangement`
          - `stopped`
          - `pong`
          - `error`

          Arrangement events are MIDI instructions, not audio samples.
          Android must schedule each event at its `time_ms`, trigger the
          corresponding instrument, and stop the note after `duration_ms`.
          The server's event times are relative to the beginning of each bar.
          EOF

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Test generated server
        run: |
          python -m unittest discover -s tests -v

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server tests docs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate AfriNode Live Band server files"
            git push
          fi
