              std::atomic<float> loudness { 0.0f };
              std::atomic<float> loudnessTrend { 0.0f };
              float lastLoudness = 0.0f;
              double audioTimeSec = 0.0;

              static constexpr int kMaxQueued = 64;
              NoteEventRecord queue[kMaxQueued];
              juce::AbstractFifo fifo { kMaxQueued };
              std::atomic<bool> phraseEndPending { false };

              bool   inNote = false, inSilence = true, phraseEndFired = false, everSang = false;
              int    currentMidi = -1;
              int    pendingMidi = -1;
              double pendingMidiStartTimeSec = 0.0;
              double noteStartBeat = 0.0, noteStartBar = 0.0;
              double noteStartAudioTimeSec = 0.0;
              float  currentVelocity = 0.8f, currentConfidence = 0.0f;
              double silenceStartBeat = 0.0;
              static constexpr double kPhraseGapBeats = 1.0;
              static constexpr double kMinNoteBeats   = 0.08;
              static constexpr double kNoteHoldSeconds = 0.060;
              static constexpr int    kMaxFlickerSemitones = 1;
          };
