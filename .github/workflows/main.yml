            </MODULES>
            <JUCEOPTIONS JUCE_WEB_BROWSER="0" JUCE_USE_CURL="0"/>
            <EXPORTFORMATS>
              <ANDROIDSTUDIO targetFolder="Builds/Android" minSdkVersion="24" androidMicNeeded="1" androidInternetNeeded="1">
                <CONFIGURATIONS>
                  <CONFIGURATION name="Debug" isDebug="1" extraCompilerFlags="-IIXWEBSOCKET_INCLUDE_PATH"/>
                  <CONFIGURATION name="Release" isDebug="0" optimise="1" extraCompilerFlags="-IIXWEBSOCKET_INCLUDE_PATH"/>
