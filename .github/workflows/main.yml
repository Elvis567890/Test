          #include <ixwebsocket/IXNetSystem.h>
          #include <ixwebsocket/IXWebSocket.h>
          #include "Arranger.h"
          #include "Config.h"

          namespace {
              bool hasExistingValue(juce::DynamicObject* obj, const juce::Identifier& prop) {
                  if (!obj || !obj->hasProperty(prop)) return false;
                  const auto v = obj->getProperty(prop);
                  return !v.isVoid() && !v.isUndefined();
              }
          }

          Arranger::Arranger() { ix::initNetSystem(); webSocket = std::make_unique<ix::WebSocket>(); }
          Arranger::~Arranger() { stop(); webSocket.reset(); ix::uninitNetSystem(); }

          void Arranger::start() {
              juce::String url = juce::String(AI_LIVE_BAND_SERVER_URL) + "/?token=" + juce::String(AI_LIVE_BAND_ACCESS_TOKEN);
              webSocket->setUrl(url.toStdString());
              webSocket->setPingInterval(30);
              webSocket->enableAutomaticReconnection();
              webSocket->setMinWaitBetweenReconnectionRetries(1000);
              webSocket->setMaxWaitBetweenReconnectionRetries(5000);
              webSocket->setOnMessageCallback([this](const ix::WebSocketMessagePtr& msg) {
                  if (msg->type == ix::WebSocketMessageType::Open) connected.store(true);
                  else if (msg->type == ix::WebSocketMessageType::Close) connected.store(false);
                  else if (msg->type == ix::WebSocketMessageType::Message) handleMessage(msg->str);
                  else if (msg->type == ix::WebSocketMessageType::Error) connected.store(false);
              });
              webSocket->start();
          }
          void Arranger::stop() { if (webSocket) webSocket->stop(); connected.store(false); }
          void Arranger::sendStateJson(const juce::String& j) {
              if (!webSocket || !connected.load()) return;
              webSocket->send(j.toStdString());
          }
          std::vector<std::shared_ptr<PlanPayload>> Arranger::drainPlans() {
              const juce::ScopedLock sl(plansLock);
              auto out = std::move(pendingPlans);
              pendingPlans.clear();
              return out;
          }
          void Arranger::handleMessage(const std::string& text) {
              try {
                  auto v = juce::JSON::parse(juce::String(text));
                  auto* o = v.getDynamicObject(); if (!o) return;
                  if (!hasExistingValue(o, "type")) return;
                  auto type = o->getProperty("type").toString();
                  if (type == "plan") {
                      auto plan = std::make_shared<PlanPayload>();
                      plan->bar = hasExistingValue(o, "bar") ? (int)o->getProperty("bar") : 0;
                      plan->tempo = hasExistingValue(o, "tempo") ? (double)o->getProperty("tempo") : 120.0;
                      plan->section = hasExistingValue(o, "section") ? o->getProperty("section").toString() : juce::String();
                      plan->chord = hasExistingValue(o, "chord") ? o->getProperty("chord").toString() : juce::String();

                      if (hasExistingValue(o, "events")) {
                          if (auto* ev = o->getProperty("events").getArray()) {
                              for (auto& e : *ev) {
                                  auto* eo = e.getDynamicObject(); if (!eo) continue;
                                  double evBar = hasExistingValue(eo, "bar") ? (double)eo->getProperty("bar") : (double)plan->bar;
                                  double evBeat = hasExistingValue(eo, "beat") ? (double)eo->getProperty("beat") : 0.0;
                                  int evCh = hasExistingValue(eo, "channel") ? (int)eo->getProperty("channel") : 0;
                                  int evNote = hasExistingValue(eo, "note") ? (int)eo->getProperty("note") : 60;
                                  float evVel = hasExistingValue(eo, "velocity") ? (float)(double)eo->getProperty("velocity") : 0.8f;
                                  double evDur = hasExistingValue(eo, "duration") ? (double)eo->getProperty("duration") : 0.5;
                                  plan->events.push_back({ evBar, evBeat, evCh, evNote, evVel, evDur });
                              }
                          }
                      }

                      if (hasExistingValue(o, "mixer")) {
                          if (auto* mo = o->getProperty("mixer").getDynamicObject()) {
                              for (auto& p : mo->getProperties()) {
                                  int ch = p.name.toString().getIntValue();
                                  if (ch < 0 || ch >= 16) continue;
                                  auto* co = p.value.getDynamicObject(); if (!co) continue;
                                  auto& m = plan->mixer[ch];
                                  m.present = true;
                                  m.preset = hasExistingValue(co, "preset") ? (int)co->getProperty("preset") : -1;
                                  m.volume = hasExistingValue(co, "volume") ? (float)(double)co->getProperty("volume") : 0.8f;
                                  m.pan    = hasExistingValue(co, "pan")    ? (float)(double)co->getProperty("pan")    : 0.0f;
                                  m.mute   = hasExistingValue(co, "mute")   ? (bool)co->getProperty("mute")         : false;
                                  m.fade   = hasExistingValue(co, "fade")   ? (float)(double)co->getProperty("fade")   : 0.0f;
                              }
                          }
                      }
                      const juce::ScopedLock sl(plansLock);
                      pendingPlans.push_back(std::move(plan));
                  } else if (type == "pong") {
                      if (hasExistingValue(o, "ts")) {
                          double t0 = (double)o->getProperty("ts");
                          if (t0 > 0) rttMs.store((float)(juce::Time::getMillisecondCounterHiRes() - t0));
                      }
                  }
              } catch (...) {}
          }
          EOF

