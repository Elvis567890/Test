name: Build AI Live Band Android App

on:
  push:
    branches: [ main, master, first-prototype ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_VERSION: 8.0.6
  ANDROID_NDK_VERSION: 26.3.11579264

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download TinySoundFont and Validate Repository SoundFont
        run: |
          set -euo pipefail

          TSF_URLS="https://raw.githubusercontent.com/schellingb/TinySoundFont/master/tsf.h https://raw.githubusercontent.com/schellingb/TinySoundFont/HEAD/tsf.h https://raw.githubusercontent.com/schellingb/TinySoundFont/main/tsf.h"

          got_tsf=0
          for url in $TSF_URLS; do
            if curl -fsSL --retry 3 --retry-delay 3 -o tsf.h "$url"; then
              echo "Downloaded tsf.h from $url"
              got_tsf=1
              break
            fi
            echo "Failed to download tsf.h from $url"
          done

          if [ "$got_tsf" != "1" ]; then
            echo "::error::Could not download tsf.h from any TinySoundFont URL."
            exit 1
          fi

          if ! grep -q "TSF_IMPLEMENTATION" tsf.h; then
            echo "::error::Downloaded tsf.h is invalid (missing TSF_IMPLEMENTATION)."
            exit 1
          fi

          cat > verify_sf2.py <<'PY'
          import os
          import struct
          import sys

          path = sys.argv[1]
          max_bytes = 45 * 1024 * 1024

          if not os.path.isfile(path):
              print(f"SoundFont file does not exist: {path}")
              sys.exit(1)

          size = os.path.getsize(path)
          if size <= 0 or size >= max_bytes:
              print(f"SoundFont size {size} bytes is invalid; must be > 0 and under {max_bytes} bytes.")
              sys.exit(1)

          with open(path, "rb") as f:
              data = f.read()

          if len(data) < 12 or data[:4] != b"RIFF" or data[8:12] != b"sfbk":
              print("File is not a valid RIFF/sfbk SF2 SoundFont.")
              sys.exit(1)

          idx = data.find(b"LIST")
          pdta_offset = -1
          while idx >= 0 and idx + 12 <= len(data):
              if data[idx + 8:idx + 12] == b"pdta":
                  pdta_offset = idx
                  break
              chunk_len = struct.unpack("<I", data[idx + 4:idx + 8])[0]
              idx = data.find(b"LIST", idx + 8 + chunk_len)

          if pdta_offset < 0:
              print("SF2 file missing pdta chunk.")
              sys.exit(1)

          pos = pdta_offset + 12
          pdta_size = struct.unpack("<I", data[pdta_offset + 4:pdta_offset + 8])[0]
          end = min(len(data), pdta_offset + 8 + pdta_size)

          presets = set()
          has_drums = False

          while pos + 8 <= end:
              ct = data[pos:pos + 4]
              cs = struct.unpack("<I", data[pos + 4:pos + 8])[0]
              payload_start = pos + 8
              payload_end = min(end, payload_start + cs)
              if ct == b"phdr" and (payload_end - payload_start) >= 38:
                  n = ((payload_end - payload_start) // 38) - 1
                  phdr = data[payload_start:payload_end]
                  for i in range(max(0, n)):
                      o = i * 38
                      preset = struct.unpack("<H", phdr[o + 20:o + 22])[0]
                      bank = struct.unpack("<H", phdr[o + 22:o + 24])[0]
                      if bank == 0 and preset < 128:
                          presets.add(preset)
                      if bank == 128:
                          has_drums = True
              pos = payload_start + cs + (cs & 1)

          print(f"GM presets: {len(presets)}/128, drums: {has_drums}, size: {size} bytes")
          if len(presets) < 128 or not has_drums:
              print("SoundFont validation failed: requires all 128 GM presets (bank 0) and drums (bank 128).")
              sys.exit(1)
          PY

          REPO_SF2="assets/SoundFont.sf2"
          if [ -f "$REPO_SF2" ]; then
            python3 verify_sf2.py "$REPO_SF2"
            cp "$REPO_SF2" SoundFont.sf2
            echo "OK: Validated and staged $REPO_SF2"
          else
            echo "assets/SoundFont.sf2 not in repo; attempting fallback SoundFont download..."
            SF2_FALLBACK_URLS="https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/master/GeneralUser-GS.sf2 https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser-GS.sf2"
            got_sf2=0
            for sf_url in $SF2_FALLBACK_URLS; do
              if curl -fsSL --retry 3 --retry-delay 3 -o SoundFont.sf2 "$sf_url" && python3 verify_sf2.py SoundFont.sf2; then
                echo "OK: Downloaded and validated fallback SoundFont from $sf_url"
                got_sf2=1
                break
              fi
              rm -f SoundFont.sf2
            done
            if [ "$got_sf2" != "1" ]; then
              echo "::error::No valid SoundFont found at assets/SoundFont.sf2 and fallback download failed."
              exit 1
            fi
          fi

      - name: Create project files
        run: |
          set -euo pipefail
          mkdir -p Source
          mv tsf.h Source/tsf.h
          mv SoundFont.sf2 Source/SoundFont.sf2

          cat > Source/Config.h << 'EOF'
          #pragma once
          #define AI_LIVE_BAND_SERVER_URL "ws://13.140.90.83:8765"
          #define AI_LIVE_BAND_ACCESS_TOKEN "ai-live-band-2024"
          EOF

          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(AILiveBand VERSION 0.4.2 LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_POLICY_VERSION_MINIMUM 3.5)

          add_subdirectory(JUCE)

          include(FetchContent)
          FetchContent_Declare(
            ixwebsocket
            GIT_REPOSITORY https://github.com/machinezone/IXWebSocket.git
            GIT_TAG        v11.4.4
          )
          set(USE_TLS OFF CACHE BOOL "" FORCE)
          set(USE_ZLIB OFF CACHE BOOL "" FORCE)
          set(USE_TEST OFF CACHE BOOL "" FORCE)
          set(USE_WS OFF CACHE BOOL "" FORCE)
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          FetchContent_MakeAvailable(ixwebsocket)

          juce_add_binary_data(BinaryData SOURCES Source/SoundFont.sf2)

          juce_add_gui_app(AILiveBand
            PRODUCT_NAME "AI Live Band"
            COMPANY_NAME "AILiveBand"
            VERSION "0.4.2"
            MICROPHONE_PERMISSION_ENABLED TRUE
            MICROPHONE_PERMISSION_TEXT "AI Live Band needs microphone access."
          )

          juce_generate_juce_header(AILiveBand)

          target_sources(AILiveBand PRIVATE
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/Main.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/MainComponent.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/PitchDetector.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/NoteTracker.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/Scheduler.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/ChordInference.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/KeyEstimator.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/TempoEstimator.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/Arranger.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/SoundFontSynth.cpp
          )

          target_compile_definitions(AILiveBand PRIVATE
            JUCE_WEB_BROWSER=0 JUCE_USE_CURL=0
            JUCE_APPLICATION_NAME_STRING="$<TARGET_PROPERTY:AILiveBand,JUCE_PRODUCT_NAME>"
            JUCE_APPLICATION_VERSION_STRING="$<TARGET_PROPERTY:AILiveBand,JUCE_VERSION>"
          )
          if(WIN32)
            target_compile_definitions(AILiveBand PRIVATE NOMINMAX)
          endif()
          if(NOT MSVC)
            target_compile_options(AILiveBand PRIVATE -Wno-zero-as-null-pointer-constant -Wno-unused-function)
          endif()
          target_link_libraries(AILiveBand
            PRIVATE BinaryData
              juce::juce_audio_utils juce::juce_audio_devices juce::juce_dsp
              juce::juce_gui_extra juce::juce_events ixwebsocket
            PUBLIC
              juce::juce_recommended_config_flags juce::juce_recommended_warning_flags
          )
          EOF

          cat > AILiveBand.jucer << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
