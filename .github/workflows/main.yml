          void MainComponent::createDetectorForSampleRateOnUiThread(double sr) {
              const double validSr = juce::jmax(8000.0, sr);
              activeDetector.store(nullptr, std::memory_order_release);
              auto nextDet = std::make_unique<PitchDetector>();
              nextDet->prepare(validSr);
              PitchDetector* raw = nextDet.get();
              ownedDetector = std::move(nextDet);
              detectorSampleRate.store(validSr, std::memory_order_release);
              activeDetector.store(raw, std::memory_order_release);
              syncEffectiveThresholdToDetector();
          }

          void MainComponent::destroyDetectorOnUiThread() {
              activeDetector.store(nullptr, std::memory_order_release);
              ownedDetector.reset();
          }

          void MainComponent::scheduleDetectorRecreateOnUiThread(double sr) {
              juce::Component::SafePointer<MainComponent> weakRef = safeThis;
              juce::MessageManager::callAsync([weakRef, sr]() {
                  if (weakRef == nullptr) return;
                  if (!weakRef->audioSessionActive.load(std::memory_order_acquire)) return;
                  PitchDetector* current = weakRef->activeDetector.load(std::memory_order_acquire);
                  if (current != nullptr && std::abs(current->getInputSampleRate() - sr) < 0.5) return;
                  weakRef->createDetectorForSampleRateOnUiThread(sr);
              });
          }

          void MainComponent::syncEffectiveThresholdToDetector() {
              const float baseThr = micThresholdSetting.load(std::memory_order_acquire);
              const float effThr = speakerModeOn.load(std::memory_order_acquire)
                  ? juce::jmax(baseThr, kSpeakerModeThresholdFloor)
                  : baseThr;
              PitchDetector* det = activeDetector.load(std::memory_order_acquire);
              if (det) det->setVoicedThreshold(effThr);
          }

          void MainComponent::showAudioSettings() {
              auto* sel = new juce::AudioDeviceSelectorComponent(deviceManager, 1, 2, 2, 2, false, false, true, false);
              sel->setSize(500, 400);
              juce::DialogWindow::LaunchOptions o;
              o.content.setOwned(sel);
              o.dialogTitle = "Audio Routing";
              o.dialogBackgroundColour = juce::Colours::darkgrey;
              o.escapeKeyTriggersCloseButton = true;
              o.useNativeTitleBar = true;
              o.resizable = false;
              o.launchAsync();
          }

          void MainComponent::resetMixerSliders() {
              channelSliders.clear();
              channelLabels.clear();
              for (int i = 0; i < 16; ++i) channelIds[i] = -1;
              instrumentsLabel.setText("Instruments: -", juce::dontSendNotification);
              resized();
          }

          void MainComponent::startAudio() {
              if (deviceManager.getCurrentAudioDevice()) return;
              resetMixerSliders();
              chordInference.clear();
              keyEstimator.reset();
              tempoEstimator.reset();
              userKeyPc.store(0);
              userKeyMinor.store(0);
              userKeyConf.store(0.0f);
              userTempoBpm.store(120.0f);
              userTempoConf.store(0.0f);
              pendingNotesForSend.clear();

              auto err = deviceManager.initialiseWithDefaultDevices(1, 2);
              if (err.isNotEmpty()) { stateLabel.setText("AUDIO ERROR: " + err, juce::dontSendNotification); return; }

              audioSessionActive.store(true, std::memory_order_release);

              double openedSr = currentSampleRate.load(std::memory_order_acquire);
              if (auto* dev = deviceManager.getCurrentAudioDevice()) {
                  const double devSr = dev->getCurrentSampleRate();
                  if (devSr > 1000.0) openedSr = devSr;
              }
              createDetectorForSampleRateOnUiThread(openedSr);

              scheduler.setFollowServerTempo(followTempoToggle.getToggleState());
              if (!followTempoToggle.getToggleState()) {
                  scheduler.setTempo(tempoSlider.getValue());
              }
              scheduler.start();
              deviceManager.addAudioCallback(this);
              arranger = std::make_unique<Arranger>();
              arranger->start();
              startButton.setButtonText("Stop");
              stateLabel.setText("CONNECTING...", juce::dontSendNotification);
          }

          void MainComponent::stopAudio() {
              audioSessionActive.store(false, std::memory_order_release);
              if (arranger) { arranger->stop(); arranger.reset(); }
              if (deviceManager.getCurrentAudioDevice()) {
                  deviceManager.removeAudioCallback(this);
                  deviceManager.closeAudioDevice();
              }
              scheduler.stop();
              destroyDetectorOnUiThread();
              synth.allNotesOff();
          }

          void MainComponent::audioDeviceAboutToStart(juce::AudioIODevice* d) {
              const double sr = d ? d->getCurrentSampleRate() : 44100.0;
              const int bufSize = d ? d->getCurrentBufferSizeSamples() : 512;
              const int outLatSamples = d ? d->getOutputLatencyInSamples() : bufSize;
              const float delayMs = (float)((double)juce::jmax(bufSize, outLatSamples) * 1000.0 / juce::jmax(1.0, sr));

              currentSampleRate.store(sr, std::memory_order_release);
              currentBufferSize.store(bufSize, std::memory_order_release);
              measuredOutputDelayMs.store(delayMs, std::memory_order_release);

              noteTracker.setBeatsPerBar(4);
              noteTracker.resetAudioClock();
              scheduler.setSampleRate(sr);
              synth.initialize(sr);
              synth.prepareLimiterForBlock(juce::jmax(4096, bufSize));

              if (audioSessionActive.load(std::memory_order_acquire)) {
                  PitchDetector* det = activeDetector.load(std::memory_order_acquire);
                  if (det == nullptr || std::abs(det->getInputSampleRate() - sr) >= 0.5) {
                      activeDetector.store(nullptr, std::memory_order_release);
                      scheduleDetectorRecreateOnUiThread(sr);
                  }
              }
          }

          void MainComponent::audioDeviceStopped() {
              activeDetector.store(nullptr, std::memory_order_release);
              measuredOutputDelayMs.store(0.0f, std::memory_order_release);
          }

          void MainComponent::audioDeviceIOCallbackWithContext(
              const float* const* in, int nIn, float* const* out, int nOut, int n,
              const juce::AudioIODeviceCallbackContext&)
          {
              PitchDetector* det = activeDetector.load(std::memory_order_acquire);
              const bool hasMic = (nIn > 0 && in != nullptr && in[0] != nullptr && n > 0);
              float micRms = 0.0f;
              if (hasMic) {
                  if (det) det->feed(in[0], n);
                  double sq = 0.0;
                  for (int i = 0; i < n; ++i) sq += (double)in[0][i] * (double)in[0][i];
                  micRms = (float)std::sqrt(sq / (double)n);
              }
              currentEnergy.store(micRms);

              auto frame = det ? det->latestFrame() : PitchDetector::Frame{};
              frame.rms = micRms;

              currentFreq.store(frame.voiced ? frame.frequency : 0.0f);
              currentConfidence.store(frame.confidence);
              noteTracker.processBlockFrames(frame, scheduler.getBeatPosition(), scheduler.getCurrentBar(),
                                             n, currentSampleRate.load());

              float* leftOut = (nOut >= 1 && out != nullptr && out[0] != nullptr) ? out[0] : nullptr;
              float* rightOut = (nOut >= 2 && out != nullptr && out[1] != nullptr) ? out[1] : nullptr;
              scheduler.processBlockStereo(leftOut, rightOut, n, synth);

              for (int ch = 2; ch < nOut; ++ch)
                  if (out != nullptr && out[ch] != nullptr) juce::FloatVectorOperations::clear(out[ch], n);
          }

          void MainComponent::rebuildMixerFromSnapshot(const InstrumentSnapshot& snap) {
              bool changed = false;
              for (int ch = 0; ch < 16; ++ch) {
                  int want = snap.ch[ch].present ? ch : -1;
                  if (want != channelIds[ch]) { changed = true; break; }
              }
              if (!changed) return;

              channelSliders.clear();
              channelLabels.clear();
              for (int ch = 0; ch < 16; ++ch) {
                  channelIds[ch] = snap.ch[ch].present ? ch : -1;
                  if (!snap.ch[ch].present) continue;
                  auto* s = new juce::Slider();
                  s->setRange(0.0, 1.0, 0.01);
                  s->setValue(1.0);
                  s->setSliderStyle(juce::Slider::LinearVertical);
                  s->setTextBoxStyle(juce::Slider::NoTextBox, false, 0, 0);
                  int capturedCh = ch;
                  s->onValueChange = [this, capturedCh, s] {
                      scheduler.queueSliderChange(capturedCh, (float)s->getValue());
                  };
                  addAndMakeVisible(s);
                  channelSliders.add(s);
                  auto* l = new juce::Label();
                  juce::String name = (ch == 9) ? "Drums" :
                      juce::String(GM_NAMES[juce::jlimit(0, 127, snap.ch[ch].preset)]);
                  l->setText(name, juce::dontSendNotification);
                  applyLabelStyle(*l, 11.0f, juce::Colours::white);
                  addAndMakeVisible(l);
                  channelLabels.add(l);
              }
              resized();
          }

          void MainComponent::sendState(bool phraseEnd) {
              if (!arranger) return;
              const bool locked = !scheduler.getFollowServerTempo();
              juce::String selectedStyle = styleComboBox.getText().trim().toLowerCase();
              if (selectedStyle.isEmpty()) selectedStyle = "auto";

              juce::var root(new juce::DynamicObject());
              auto* o = root.getDynamicObject();
              o->setProperty("type", "state");
              o->setProperty("ts", juce::Time::getMillisecondCounterHiRes());
              o->setProperty("singing", noteTracker.isSinging());
              o->setProperty("loudness", noteTracker.getLoudness());
              o->setProperty("loudnessTrend", noteTracker.getLoudnessTrend());
              o->setProperty("tempo", locked ? tempoSlider.getValue() : scheduler.getTempo());
              o->setProperty("tempoLocked", locked);
              o->setProperty("bar", scheduler.getCurrentBar());
              o->setProperty("beat", scheduler.getBeatPosition());
              o->setProperty("chord", chordInference.getChord());
              int kpc = userKeyPc.load();
              o->setProperty("key", juce::String(GM_KEYS[kpc]));
              o->setProperty("keyMode", userKeyMinor.load() ? "minor" : "major");
              o->setProperty("keyConfidence", userKeyConf.load());
              o->setProperty("userTempo", userTempoBpm.load());
              o->setProperty("userTempoConfidence", userTempoConf.load());
              o->setProperty("style", selectedStyle);
              o->setProperty("phraseEnd", phraseEnd);

              juce::Array<juce::var> jnotes;
              for (auto& e : pendingNotesForSend) {
                  juce::var nv(new juce::DynamicObject());
                  auto* no = nv.getDynamicObject();
                  no->setProperty("bar", e.bar);
                  no->setProperty("beat", e.beat);
                  no->setProperty("midi", e.midi);
                  no->setProperty("velocity", e.velocity);
                  no->setProperty("duration", e.durationBeats);
                  no->setProperty("confidence", e.confidence);
                  jnotes.add(nv);
              }
              o->setProperty("notes", juce::var(jnotes));
              pendingNotesForSend.clear();
              arranger->sendStateJson(juce::JSON::toString(root, false));
          }

          void MainComponent::timerCallback() {
              auto events = noteTracker.drainEvents();
              for (auto& e : events) {
                  chordInference.addNote(e.midi);
                  keyEstimator.addNoteDuration(e.midi, e.durationBeats);
                  tempoEstimator.addOnset(e.onsetTimeSec);
                  if (pendingNotesForSend.size() < 64) pendingNotesForSend.push_back(e);
              }
              auto kr = keyEstimator.estimate();
              userKeyPc.store(kr.tonic);
              userKeyMinor.store(kr.isMinor ? 1 : 0);
              userKeyConf.store(kr.confidence);
              auto tr = tempoEstimator.estimate();
              userTempoBpm.store((float)tr.bpm);
              userTempoConf.store(tr.confidence);

              if (arranger) {
                  auto incoming = arranger->drainPlans();
                  for (auto& sp : incoming) {
                      RawPlan rp;
                      rp.bar = sp->bar;
                      rp.tempo = sp->tempo;
                      rp.numEvents = juce::jmin((int)sp->events.size(), kMaxEventsPerBar);
                      for (int i = 0; i < rp.numEvents; ++i)
                          rp.events[i] = { sp->events[i].beat, sp->events[i].channel, sp->events[i].midi,
                                           sp->events[i].velocity, sp->events[i].duration };
                      for (int ch = 0; ch < 16; ++ch) rp.mixer[ch] = sp->mixer[ch];
                      scheduler.queuePlan(rp);
                  }
              }

              float f = currentFreq.load(), conf = currentConfidence.load(), e = currentEnergy.load();
              micLevelNormalized = juce::jlimit(0.0, 1.0, (double)(e * 6.0f));

              if (f > 0.0f && conf > 0.4f) {
                  noteLabel.setText(PitchDetector::freqToNote(f), juce::dontSendNotification);
                  chordLabel.setText(chordInference.getChord(), juce::dontSendNotification);
                  stateLabel.setText("SINGING", juce::dontSendNotification);
                  stateLabel.setColour(juce::Label::textColourId, juce::Colours::cyan);
              } else if (e > 0.02f) {
                  noteLabel.setText("-", juce::dontSendNotification);
                  chordLabel.setText("-", juce::dontSendNotification);
                  stateLabel.setText("NO PITCH", juce::dontSendNotification);
                  stateLabel.setColour(juce::Label::textColourId, juce::Colours::yellow);
              } else if (scheduler.isCountingIn()) {
                  stateLabel.setText("COUNT-IN...", juce::dontSendNotification);
                  stateLabel.setColour(juce::Label::textColourId, juce::Colours::orange);
              } else if (scheduler.isRunning()) {
                  stateLabel.setText("PLAYING", juce::dontSendNotification);
                  stateLabel.setColour(juce::Label::textColourId, juce::Colours::green);
              } else {
                  stateLabel.setText("STOPPED", juce::dontSendNotification);
                  stateLabel.setColour(juce::Label::textColourId, juce::Colours::grey);
              }

              PitchDetector* det = activeDetector.load(std::memory_order_acquire);
              const int detSrHz = det ? (int)std::llround(det->getInputSampleRate())
                                      : (int)std::llround(detectorSampleRate.load(std::memory_order_acquire));
              const int detAnaHz = det ? (int)std::llround(det->getAnalysisSampleRate()) : 0;
              latencyLabel.setText(
                  "Latency: buf " + juce::String(currentBufferSize.load()) + " smp | out "
                  + juce::String(measuredOutputDelayMs.load(), 1) + " ms | det "
                  + juce::String(detSrHz) + "->" + juce::String(detAnaHz) + " Hz",
                  juce::dontSendNotification);

              juce::String keyStr = juce::String(GM_KEYS[userKeyPc.load()])
                                  + (userKeyMinor.load() ? " minor" : " major");
              keyLabel.setText("Key: " + keyStr + " (" + juce::String((int)(userKeyConf.load() * 100)) + "%)",
                               juce::dontSendNotification);
              tempoLabel.setText("Band: " + juce::String((int)scheduler.getTempo()) + " BPM | You: "
                                 + juce::String((int)userTempoBpm.load()) + " BPM ("
                                 + juce::String((int)(userTempoConf.load() * 100)) + "%)",
                                 juce::dontSendNotification);

              auto snap = scheduler.getInstrumentSnapshot();
              juce::StringArray parts;
              for (int ch = 0; ch < 16; ++ch) {
                  if (!snap.ch[ch].present) continue;
                  juce::String name = (ch == 9) ? "Drums" : juce::String(GM_NAMES[juce::jlimit(0,127,snap.ch[ch].preset)]);
                  parts.add("ch" + juce::String(ch) + ": " + name);
              }
              instrumentsLabel.setText(parts.isEmpty() ? "Instruments: -" : parts.joinIntoString(" | "),
                                       juce::dontSendNotification);
              rebuildMixerFromSnapshot(snap);

              if (arranger) {
                  if (arranger->isConnected())
                      rttLabel.setText("RTT: " + juce::String((int)arranger->getRttMs()) + " ms", juce::dontSendNotification);
                  else
                      rttLabel.setText("OFFLINE (looping last bar)", juce::dontSendNotification);
                  const double now = juce::Time::getMillisecondCounterHiRes();
                  bool phraseEnd = noteTracker.drainPhraseEnd();
                  if (phraseEnd || (now - lastSendMs >= 100.0)) {
                      lastSendMs = now;
                      sendState(phraseEnd);
                  }
                  if (now >= (double)nextPingMs) {
                      nextPingMs = (int64_t)now + 3000;
                      if (arranger->isConnected()) {
                          juce::var pv(new juce::DynamicObject());
                          pv.getDynamicObject()->setProperty("type", "ping");
                          pv.getDynamicObject()->setProperty("ts", now);
                          arranger->sendStateJson(juce::JSON::toString(pv, false));
                      }
                  }
              }
              repaint();
          }

          void MainComponent::paint(juce::Graphics& g) {
              g.fillAll(juce::Colour::fromRGB(10, 12, 18));
              auto c = getLocalBounds().getCentre();
              float r = 70.0f + currentEnergy.load() * 200.0f;
              juce::ColourGradient grad(juce::Colour::fromRGB(0,255,200).withAlpha(0.2f),
                                        (float)c.x, (float)c.y,
                                        juce::Colours::black.withAlpha(0.0f),
                                        (float)c.x + r, (float)c.y, true);
              g.setGradientFill(grad);
              g.fillEllipse((float)c.x - r, (float)c.y - r, r * 2, r * 2);
          }

          void MainComponent::resized() {
              auto area = getLocalBounds().reduced(16);
              auto top = area.removeFromTop(26);
              stateLabel.setBounds(top.removeFromLeft(top.getWidth() / 3));
              rttLabel.setBounds(top.removeFromLeft(top.getWidth() / 3));
              latencyLabel.setBounds(top);
              area.removeFromTop(6);
              noteLabel.setBounds(area.removeFromTop(64));
              chordLabel.setBounds(area.removeFromTop(42));
              keyLabel.setBounds(area.removeFromTop(24));
              instrumentsLabel.setBounds(area.removeFromTop(20));
              speakerHintLabel.setBounds(area.removeFromTop(20));

              auto tempoRow = area.removeFromTop(30);
              tempoLabel.setBounds(tempoRow.removeFromLeft(tempoRow.getWidth() / 2));
              followTempoToggle.setBounds(tempoRow.removeFromLeft(175));
              tempoSlider.setBounds(tempoRow.reduced(2));

              auto micRow = area.removeFromTop(30);
              micSensitivityLabel.setBounds(micRow.removeFromLeft(120));
              micLevelMeter.setBounds(micRow.removeFromLeft(110).reduced(4));
              micSensitivitySlider.setBounds(micRow.reduced(2));

              auto modeRow = area.removeFromTop(30);
              speakerModeToggle.setBounds(modeRow.removeFromLeft(175));
              styleTitleLabel.setBounds(modeRow.removeFromLeft(60));
              styleComboBox.setBounds(modeRow.removeFromLeft(150).reduced(2));

              auto buttons = area.removeFromBottom(46);
              startButton.setBounds(buttons.removeFromLeft(buttons.getWidth() / 2).reduced(6));
              settingsButton.setBounds(buttons.reduced(6));

              auto mixer = area.removeFromBottom(160);
              int n = channelSliders.size();
              if (n > 0) {
                  int w = mixer.getWidth() / n;
                  for (int i = 0; i < n; ++i) {
                      auto cell = mixer.removeFromLeft(w).reduced(4);
                      channelLabels[i]->setBounds(cell.removeFromBottom(16));
                      channelSliders[i]->setBounds(cell);
                  }
              }
          }
          EOF

          cat > Source/Main.cpp << 'EOF'
          #include <JuceHeader.h>
          #include "MainComponent.h"
          class AILiveBandApplication : public juce::JUCEApplication {
          public:
              const juce::String getApplicationName() override    { return "AI Live Band"; }
              const juce::String getApplicationVersion() override { return "0.4.2"; }
              bool moreThanOneInstanceAllowed() override          { return true; }
              void initialise(const juce::String&) override { mainWindow.reset(new MainWindow(getApplicationName())); }
              void shutdown() override { mainWindow.reset(); }
              void systemRequestedQuit() override { quit(); }
              class MainWindow : public juce::DocumentWindow {
              public:
                  explicit MainWindow(juce::String name) : DocumentWindow(name, juce::Colours::black,
                      #if JUCE_ANDROID
                      0
                      #else
                      DocumentWindow::allButtons
                      #endif
                  ) {
                      #if !JUCE_ANDROID
                      setUsingNativeTitleBar(true); setResizable(true, true);
                      #endif
                      setContentOwned(new MainComponent(), true);
                      #if JUCE_ANDROID
                      setFullScreen(true);
                      #else
                      centreWithSize(getWidth(), getHeight());
                      #endif
                      setVisible(true);
                  }
                  void closeButtonPressed() override { JUCEApplication::getInstance()->systemRequestedQuit(); }
              };
          private:
              std::unique_ptr<MainWindow> mainWindow;
          };
          START_JUCE_APPLICATION(AILiveBandApplication)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: source
          if-no-files-found: error
          path: |
            CMakeLists.txt
            AILiveBand.jucer
            Source/

  build-android:
    needs: scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with: { path: ~/.gradle/wrapper/dists, key: "${{ runner.os }}-gradle-wrapper-v1" }
      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with: { path: JUCE, key: "${{ runner.os }}-juce-${{ env.JUCE_VERSION }}" }
      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --branch ${{ env.JUCE_VERSION }} --depth 1 https://github.com/juce-framework/JUCE.git
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK components
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "ndk;$ANDROID_NDK_VERSION" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfreetype6-dev libfontconfig1-dev libasound2-dev libjack-jackd2-dev \
            ladspa-sdk libwebkit2gtk-4.1-dev libgtk-3-dev libglu1-mesa-dev mesa-common-dev libegl-dev
      - name: Pre-build IXWebSocket for Android (all ABIs)
        run: |
          git clone --depth 1 --branch v11.4.4 https://github.com/machinezone/IXWebSocket.git ixwebsocket-src
          mkdir -p ixwebsocket-android/libs ixwebsocket-android/include
          NDK_TOOLCHAIN="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake"
          test -f "$NDK_TOOLCHAIN" || (echo "::error::NDK toolchain not found" && exit 1)
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            cmake -S ixwebsocket-src -B "ixwebsocket-src/build-${ABI}" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_TOOLCHAIN" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-24 \
              -DUSE_TLS=OFF -DUSE_ZLIB=OFF -DUSE_TEST=OFF -DUSE_WS=OFF \
              -DBUILD_SHARED_LIBS=OFF -DCMAKE_CXX_STANDARD=17 \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release
            cmake --build "ixwebsocket-src/build-${ABI}" --target ixwebsocket -j"$(nproc)"
            mkdir -p "ixwebsocket-android/libs/${ABI}"
            find "ixwebsocket-src/build-${ABI}" -name "libixwebsocket.a" -exec cp {} "ixwebsocket-android/libs/${ABI}/" \;
            test -f "ixwebsocket-android/libs/${ABI}/libixwebsocket.a" || (echo "::error::libixwebsocket.a missing for ${ABI}" && exit 1)
          done
          cp -r ixwebsocket-src/ixwebsocket ixwebsocket-android/include/
          find ixwebsocket-android -name "*.a"
      - name: Build Projucer CLI
        run: |
          cd JUCE/extras/Projucer/Builds/LinuxMakefile
          make -j"$(nproc)" CONFIG=Release
          echo "$GITHUB_WORKSPACE/JUCE/extras/Projucer/Builds/LinuxMakefile/build" >> $GITHUB_PATH
      - name: Generate Android Gradle Project via Projucer
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          sed -i "s|IXWEBSOCKET_INCLUDE_PATH|$GITHUB_WORKSPACE/ixwebsocket-android/include|g" AILiveBand.jucer
          Projucer --set-global-search-path linux defaultJuceModulePath "$GITHUB_WORKSPACE/JUCE/modules"
          Projucer --set-global-search-path linux androidSDKPath "$ANDROID_HOME"
          Projucer --resave AILiveBand.jucer
          ls -la Builds/Android/ || (echo "::error::Builds/Android not found" && exit 1)

          CMAKE_FILE="Builds/Android/app/CMakeLists.txt"
          if [ -f "$CMAKE_FILE" ]; then
            python3 - "$CMAKE_FILE" "$GITHUB_WORKSPACE" <<'PY'
          import re, sys
          path, ws = sys.argv[1], sys.argv[2]
          lines = open(path).read().split("\n")
          lines = [l for l in lines if not re.search(r"target_link_libraries.*AILiveBand", l)]
          abi_var = "$" + "{ANDROID_ABI}"
          inject = [
              'function(target_link_libraries)',
              '  if(TARGET "${ARGV0}")',
              '    _target_link_libraries(${ARGV})',
              '  else()',
              '    message(WARNING "Skipping target_link_libraries for missing target ${ARGV0}")',
              '  endif()',
              'endfunction()',
              'include_directories("%s/ixwebsocket-android/include")' % ws,
              'link_libraries("%s/ixwebsocket-android/libs/%s/libixwebsocket.a")' % (ws, abi_var),
          ]
          idx = None
          for i, l in enumerate(lines):
              if re.match(r"^\s*project\s*\(", l, re.I):
                  idx = i; break
          if idx is None:
              for i, l in enumerate(lines):
                  if re.match(r"^\s*cmake_minimum_required\s*\(", l, re.I):
                      idx = i; break
          if idx is None: lines = inject + lines
          else: lines = lines[:idx + 1] + inject + lines[idx + 1:]
          open(path, "w").write("\n".join(lines))
          PY
            grep -n "ixwebsocket" "$CMAKE_FILE" || (echo "::error::CMake patch did not apply" && exit 1)
          else
            echo "::error::$CMAKE_FILE not found" && exit 1
          fi

          MANIFEST_PATH="Builds/Android/app/src/main/AndroidManifest.xml"
          for PERM in RECORD_AUDIO INTERNET; do
            if ! grep -q "android.permission.$PERM" "$MANIFEST_PATH"; then
              sed -i "/<application/i \    <uses-permission android:name=\"android.permission.$PERM\" />" "$MANIFEST_PATH"
            fi
            grep -q "android.permission.$PERM" "$MANIFEST_PATH" || (echo "::error::$PERM missing" && exit 1)
          done
          if ! grep -q "usesCleartextTraffic" "$MANIFEST_PATH"; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST_PATH"
          fi

          GRADLE_FILE="Builds/Android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i '/DANDROID_STL=c++_shared/d' "$GRADLE_FILE"
            sed -i '/CMAKE_MAKE_PROGRAM/d' "$GRADLE_FILE"
            if ! grep -q ndkVersion "$GRADLE_FILE"; then
              sed -i "0,/^android {/s//android {\n    ndkVersion \"$ANDROID_NDK_VERSION\"/" "$GRADLE_FILE"
            fi
            python3 - "$GRADLE_FILE" "$HOME" <<'PY'
          import sys
          path, home = sys.argv[1], sys.argv[2]
          txt = open(path).read()
          ks_path = f"{home}/.android/debug.keystore"
          signing_block = f"""
    signingConfigs {{
        debug {{
            storeFile file("{ks_path}")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }}
    }}
"""
          if "signingConfigs" not in txt:
              txt = txt.replace("android {\n", "android {\n" + signing_block, 1)
          open(path, "w").write(txt)
          PY
          fi
      - name: Prefetch Gradle Distribution with Retries
        run: |
          PROPS_FILE="Builds/Android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROPS_FILE" ]; then
            URL=$(sed -n 's/^distributionUrl=//p' "$PROPS_FILE" | sed 's/\\//g')
            ZIP_NAME=${URL##*/}
            DIST_NAME=${ZIP_NAME%.zip}
            HASH=$(python3 - "$URL" <<'PY'
          import hashlib, sys
          n = int.from_bytes(hashlib.md5(sys.argv[1].encode()).digest(), "big")
          d = "0123456789abcdefghijklmnopqrstuvwxyz"
          s = ""
          while n:
              n, r = divmod(n, 36)
              s = d[r] + s
          print(s)
          PY
          )
            DIST_DIR="$HOME/.gradle/wrapper/dists/$DIST_NAME/$HASH"
            mkdir -p "$DIST_DIR"
            if [ ! -f "$DIST_DIR/$ZIP_NAME" ] && [ ! -d "$DIST_DIR/${DIST_NAME%-bin}" ]; then
              for i in 1 2 3 4 5 6 7 8; do
                if curl -fsSL --connect-timeout 15 --max-time 300 -o "$DIST_DIR/$ZIP_NAME.part" "$URL" && \
                   unzip -tq "$DIST_DIR/$ZIP_NAME.part" > /dev/null 2>&1; then
                  mv "$DIST_DIR/$ZIP_NAME.part" "$DIST_DIR/$ZIP_NAME"
                  echo "OK: Gradle distribution downloaded (attempt $i)"; break
                fi
                echo "WARN: Download failed (attempt $i/8), retrying in 15s..."
                rm -f "$DIST_DIR/$ZIP_NAME.part"
                sleep 15
              done
            fi
          fi
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK with Gradle
        run: |
          cd Builds/Android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info
      - name: Verify IXWebSocket is linked
        run: |
          APK_PATH=$(find Builds/Android -name "*.apk" -type f | head -n 1)
          test -n "$APK_PATH" || (echo "::error::No APK" && exit 1)
          mkdir -p apk_check
          unzip -o "$APK_PATH" "lib/arm64-v8a/*.so" -d apk_check
          if grep -aq "Sec-WebSocket-Key" apk_check/lib/arm64-v8a/*.so; then echo "OK: IXWebSocket code found."
          else echo "::error::IXWebSocket NOT found" && exit 1; fi
      - name: Locate and Copy APK
        run: |
          APK_PATH=$(find Builds/Android -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ]; then cp "$APK_PATH" ./AILiveBand.apk
          else echo "::error::No APK generated" && exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: AILiveBand-android, path: ./AILiveBand.apk, if-no-files-found: error }
