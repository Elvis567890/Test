          cat > Source/SoundFontSynth.cpp << 'EOF'
          #include "SoundFontSynth.h"
          #define TSF_IMPLEMENTATION
          #include "tsf.h"

          SoundFontSynth::SoundFontSynth() {}
          SoundFontSynth::~SoundFontSynth() {
              if (wetSynth) tsf_close(wetSynth);
              if (drySynth) tsf_close(drySynth);
          }

          void SoundFontSynth::prepareLimiterForBlock(int maxBlockSamples) {
              maxBlock = juce::jmax(maxBlockSamples, 512);
              juce::dsp::ProcessSpec spec { sr, (juce::uint32)maxBlock, 2 };
              compressor.prepare(spec);
              compressor.setThreshold(-14.0f);
              compressor.setRatio(2.5f);
              compressor.setAttack(15.0f);
              compressor.setRelease(140.0f);

              limiter.prepare(spec);
              limiter.setThreshold(-1.0f);
              limiter.setRelease(50.0f);

              busBuf.setSize(2, maxBlock, false, false, true);
              if (scratchSize < maxBlock * 2) {
                  scratch.allocate((size_t)(maxBlock * 2), false);
                  scratchSize = maxBlock * 2;
              }
              if (wetBufSize < maxBlock) {
                  wetLeft.allocate((size_t)maxBlock, false);
                  wetRight.allocate((size_t)maxBlock, false);
                  wetBufSize = maxBlock;
              }
          }

          void SoundFontSynth::initialize(double sampleRate) {
              sr = sampleRate;
              if (wetSynth) { tsf_close(wetSynth); wetSynth = nullptr; }
              if (drySynth) { tsf_close(drySynth); drySynth = nullptr; }
              numActive = 0;
              if (BinaryData::SoundFont_sf2Size == 0) return;

              drySynth = tsf_load_memory(BinaryData::SoundFont_sf2, BinaryData::SoundFont_sf2Size);
              if (!drySynth) return;
              wetSynth = tsf_copy(drySynth);

              tsf_set_max_voices(drySynth, kMaxVoices);
              tsf_set_output(drySynth, TSF_STEREO_INTERLEAVED, (int)sr, 0);
              if (wetSynth) {
                  tsf_set_max_voices(wetSynth, kMaxVoices);
                  tsf_set_output(wetSynth, TSF_STEREO_INTERLEAVED, (int)sr, 0);
              }

              for (int ch = 0; ch < 16; ++ch) {
                  tsf_channel_set_presetnumber(drySynth, ch, 0, ch == 9 ? 1 : 0);
                  tsf_channel_set_pan(drySynth, ch, 0.5f);
                  if (wetSynth) {
                      tsf_channel_set_presetnumber(wetSynth, ch, 0, ch == 9 ? 1 : 0);
                      tsf_channel_set_pan(wetSynth, ch, 0.5f);
                  }
              }

              reverb.setSampleRate(sr);
              juce::Reverb::Parameters p;
              p.roomSize = 0.55f;
              p.damping = 0.55f;
              p.wetLevel = 0.35f;
              p.dryLevel = 0.85f;
              p.width = 0.85f;
              p.freezeMode = 0.0f;
              reverb.setParameters(p);

              prepareLimiterForBlock(juce::jmax(4096, maxBlock));
          }

          void SoundFontSynth::enforcePolyphony(tsf* targetSynth, int maxVoices) {
              while (numActive > maxVoices) {
                  int victim = -1;
                  for (int i = 0; i < numActive; ++i) {
                      bool onTarget = (isReverbChannel(active[i].ch) && targetSynth == wetSynth)
                                   || (!isReverbChannel(active[i].ch) && targetSynth == drySynth);
                      if (onTarget) { victim = i; break; }
                  }
                  if (victim < 0) victim = 0;
                  if (targetSynth) tsf_channel_note_off(targetSynth, active[victim].ch, active[victim].midi);
                  for (int i = victim; i < numActive - 1; ++i) active[i] = active[i + 1];
                  --numActive;
              }
          }

          void SoundFontSynth::recordVoice(int ch, int midi, bool reverbBus) {
              for (int i = 0; i < numActive; ++i) {
                  if (active[i].ch == ch && active[i].midi == midi) return;
              }
              if (numActive >= kMaxVoices) {
                  if (drySynth) tsf_channel_note_off(drySynth, active[0].ch, active[0].midi);
                  if (wetSynth) tsf_channel_note_off(wetSynth, active[0].ch, active[0].midi);
                  for (int i = 0; i < numActive - 1; ++i) active[i] = active[i + 1];
                  --numActive;
              }
              active[numActive++] = { ch, midi, reverbBus };
          }

          void SoundFontSynth::removeVoice(int ch, int midi, bool /*reverbBus*/) {
              for (int i = 0; i < numActive; ) {
                  if (active[i].ch == ch && active[i].midi == midi) {
                      active[i] = active[--numActive];
                  } else {
                      ++i;
                  }
              }
          }

          void SoundFontSynth::noteOn(int ch, int m, float v) {
              if (!drySynth) return;
              const bool useWet = isReverbChannel(ch) && (wetSynth != nullptr);
              tsf* target = useWet ? wetSynth : drySynth;
              enforcePolyphony(target, kMaxVoices - 1);
              tsf_channel_note_on(target, ch, m, v);
              recordVoice(ch, m, useWet);
          }

          void SoundFontSynth::noteOff(int ch, int m) {
              if (!drySynth) return;
              const bool useWet = isReverbChannel(ch) && (wetSynth != nullptr);
              tsf* target = useWet ? wetSynth : drySynth;
              tsf_channel_note_off(target, ch, m);
              removeVoice(ch, m, useWet);
          }

          void SoundFontSynth::allNotesOff() {
              if (drySynth) tsf_note_off_all(drySynth);
              if (wetSynth) tsf_note_off_all(wetSynth);
              numActive = 0;
          }

          void SoundFontSynth::setInstrument(int ch, int p) {
              if (drySynth) tsf_channel_set_presetnumber(drySynth, ch, p, ch == 9 ? 1 : 0);
              if (wetSynth) tsf_channel_set_presetnumber(wetSynth, ch, p, ch == 9 ? 1 : 0);
          }

          void SoundFontSynth::setChannelVolume(int ch, float v) {
              const float clamped = juce::jlimit(0.0f, 1.0f, v);
              if (drySynth) tsf_channel_set_volume(drySynth, ch, clamped);
              if (wetSynth) tsf_channel_set_volume(wetSynth, ch, clamped);
          }

          void SoundFontSynth::setChannelPan(int ch, float pan) {
              const float sfPan = juce::jlimit(0.0f, 1.0f, (pan + 1.0f) * 0.5f);
              if (drySynth) tsf_channel_set_pan(drySynth, ch, sfPan);
              if (wetSynth) tsf_channel_set_pan(wetSynth, ch, sfPan);
          }

          void SoundFontSynth::renderSlice(float* left, float* right, int startSample, int n) {
              if (!left || n <= 0) return;
              float* lPtr = left + startSample;
              float* rPtr = right ? (right + startSample) : nullptr;
              if (!drySynth) {
                  juce::FloatVectorOperations::clear(lPtr, n);
                  if (rPtr) juce::FloatVectorOperations::clear(rPtr, n);
                  return;
              }
              if (scratchSize < n * 2) {
                  scratch.allocate((size_t)(n * 2), false);
                  scratchSize = n * 2;
              }
              if (wetBufSize < n) {
                  wetLeft.allocate((size_t)n, false);
                  wetRight.allocate((size_t)n, false);
                  wetBufSize = n;
              }
              if (busBuf.getNumSamples() < n) {
                  busBuf.setSize(2, n, false, false, true);
              }

              tsf_render_float(drySynth, scratch.get(), n, 0);
              for (int i = 0; i < n; ++i) {
                  lPtr[i] = scratch[i * 2];
                  if (rPtr) rPtr[i] = scratch[i * 2 + 1];
              }

              if (wetSynth) {
                  tsf_render_float(wetSynth, scratch.get(), n, 0);
                  for (int i = 0; i < n; ++i) {
                      wetLeft[i] = scratch[i * 2];
                      wetRight[i] = scratch[i * 2 + 1];
                  }
                  if (rPtr) {
                      reverb.processStereo(wetLeft.get(), wetRight.get(), n);
                      juce::FloatVectorOperations::add(lPtr, wetLeft.get(), n);
                      juce::FloatVectorOperations::add(rPtr, wetRight.get(), n);
                  } else {
                      reverb.processMono(wetLeft.get(), n);
                      juce::FloatVectorOperations::add(lPtr, wetLeft.get(), n);
                  }
              }

              juce::FloatVectorOperations::copy(busBuf.getWritePointer(0), lPtr, n);
              if (rPtr) {
                  juce::FloatVectorOperations::copy(busBuf.getWritePointer(1), rPtr, n);
              } else {
                  juce::FloatVectorOperations::copy(busBuf.getWritePointer(1), lPtr, n);
              }

              juce::dsp::AudioBlock<float> blk(busBuf.getArrayOfWritePointers(), 2, (size_t)n);
              juce::dsp::ProcessContextReplacing<float> ctx(blk);
              compressor.process(ctx);
              limiter.process(ctx);

              juce::FloatVectorOperations::copy(lPtr, busBuf.getReadPointer(0), n);
              if (rPtr) juce::FloatVectorOperations::copy(rPtr, busBuf.getReadPointer(1), n);
          }
