          #include "ChordInference.h"
          namespace {
              const char* ROOTS[] = {"C","C#","D","D#","E","F","F#","G","G#","A","A#","B"};
              struct T { const char* name; std::vector<int> iv; };
              const std::vector<T> TEMPLATES = {
                  {"maj",{0,4,7}},{"min",{0,3,7}},{"dim",{0,3,6}},{"aug",{0,4,8}},
                  {"sus4",{0,5,7}},{"maj7",{0,4,7,11}},{"min7",{0,3,7,10}}
              };
              int parseRoot(const juce::String& chord, juce::String& quality) {
                  quality = juce::String();
                  if (chord.isEmpty()) return -1;
                  int len = (chord.length() > 1 && chord[1] == '#') ? 2 : 1;
                  juce::String name = chord.substring(0, len);
                  quality = chord.substring(len);
                  for (int i = 0; i < 12; ++i) if (name == ROOTS[i]) return i;
                  return -1;
              }
          }
          void ChordInference::addNote(int m) {
              if (m <= 0) return;
              recent.push_back(m);
              if (recent.size() > 12) recent.erase(recent.begin());
          }
          void ChordInference::clear() { recent.clear(); }
          juce::String ChordInference::getChord() const {
              if (recent.empty()) return "-";
              int counts[12] = {0};
              for (int n : recent) counts[((n % 12) + 12) % 12]++;
              int bestRoot = -1, bestScore = -1000000; juce::String bestName;
              for (int root = 0; root < 12; ++root) {
                  for (auto& t : TEMPLATES) {
                      int score = 0, outside = 0; bool in[12] = {false};
                      for (int iv : t.iv) in[(root + iv) % 12] = true;
                      for (int pc = 0; pc < 12; ++pc) { if (in[pc]) score += counts[pc]; else outside += counts[pc]; }
                      score -= outside / 2;
                      if (score > bestScore) { bestScore = score; bestRoot = root; bestName = juce::String(ROOTS[root]) + t.name; }
                  }
              }
              return bestRoot < 0 ? juce::String("-") : bestName;
          }
          int ChordInference::getRootNote() const {
              juce::String c = getChord(); if (c == "-") return 48;
              juce::String q; int r = parseRoot(c, q); return r < 0 ? 48 : 48 + r;
          }
          std::vector<int> ChordInference::getChordNotes() const {
              std::vector<int> notes;
              juce::String c = getChord(); if (c == "-") return notes;
              juce::String q; int r = parseRoot(c, q); if (r < 0) return notes;
              int root = 60 + r; notes.push_back(root);
              if (q.contains("maj")) { notes.push_back(root+4); notes.push_back(root+7); if (q.contains("7")) notes.push_back(root+11); }
              else if (q.contains("min")) { notes.push_back(root+3); notes.push_back(root+7); if (q.contains("7")) notes.push_back(root+10); }
              else if (q.contains("dim")) { notes.push_back(root+3); notes.push_back(root+6); }
              else if (q.contains("aug")) { notes.push_back(root+4); notes.push_back(root+8); }
              else if (q.contains("sus4")) { notes.push_back(root+5); notes.push_back(root+7); }
              return notes;
          }
