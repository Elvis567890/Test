              std::vector<std::shared_ptr<PlanPayload>> drainPlans();
              bool  isConnected() const { return connected.load(); }
              float getRttMs()    const { return rttMs.load(); }
          private:
              void handleMessage(const std::string& text);
              std::unique_ptr<ix::WebSocket> webSocket;
              std::atomic<bool>  connected { false };
              std::atomic<float> rttMs     { 0.0f };
              juce::CriticalSection plansLock;
              std::vector<std::shared_ptr<PlanPayload>> pendingPlans;
          };
